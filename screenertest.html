    <script>
        // ==========================================
        // 初始化設置
        // ==========================================
        const SUPABASE_URL = 'https://dfeqgzgjnkcinduhaqbx.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_eOJwtn52IK-ud7RAvZlXKQ_8Io078XT'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const TABLE_FLOW_HK = 'money_flow_hk';          
        const TABLE_FLOW_US = 'money_flow_sp500';       
        const TABLE_MULTI_HK = 'multi_stock_analysis_hk';
        const TABLE_MULTI_US = 'multi_stock_analysis_sp500';

        let latestMarketData = [];
        let filteredScreenerData = []; 
        let activeMarket = 'HK'; 
        let activeStrategy = 'short_term'; 

        const hkDatePicker = document.getElementById('hk-date');
        const usDatePicker = document.getElementById('us-date');
        const searchInput = document.getElementById('search-ticker'); 

        // 策略說明文字庫
        const strategyTexts = {
            'short_term': `
                <li><strong class="text-orange-600">主力建倉：</strong>過去 5 日與 10 日資金皆必須為<span class="font-bold text-green-600">正流入</span>。</li>
                <li><strong class="text-orange-600">跌深反彈：</strong>資金流量指標 (MFI) 必須小於 <span class="font-bold text-red-600">45</span>。</li>
                <li><strong class="text-orange-600">安全防護：</strong>價值評分 Value Rating <span class="font-bold text-orange-600">>= 3</span> <span class="text-gray-500">(確保公司有底子)</span>。</li>
                <li><strong class="text-gray-500">排序權重：</strong>極度冷門 (MFI越低 40%) + 吸籌力道 (5D資金 40%) + 點火跡象 (爆量 20%)。</li>
            `,
            'long_term': `
                <li><strong class="text-indigo-700">護城河條件：</strong>價值評分 Value Rating <span class="font-bold text-indigo-700">>= 3</span>，且 賺錢效率 ROE <span class="font-bold text-indigo-700">> 8%</span>。</li>
                <li><strong class="text-indigo-700">技術面極限接刀：</strong>RSI <span class="font-bold text-red-600">< 40</span> 且 KDJ_J <span class="font-bold text-red-600">< 20</span>。</li>
                <li><strong class="text-indigo-700">跌破年線打折區：</strong>現價 <span class="font-bold text-red-600">低於</span> 200日均線 (SMA200)。</li>
                <li><strong class="text-gray-500">排序權重：</strong>資金不限正流入，靠綜合分數找出<span class="font-bold text-indigo-700">資金流出縮減</span>的最深恐慌底點。</li>
            `,
            '52w_low': `
                <li><strong class="text-blue-700">護城河條件：</strong>價值評分 Value Rating <span class="font-bold text-blue-700">>= 3</span>，且 賺錢效率 ROE <span class="font-bold text-blue-700">> 8%</span>。</li>
                <li><strong class="text-blue-700">底部右側起漲：</strong>現價距離 52 周低位介於 <span class="font-bold text-blue-700">10% ~ 30%</span> 之間。</li>
                <li><strong class="text-blue-700">流動性防護：</strong>10日均成交金額大於 <span class="font-bold text-blue-700">1000 萬港幣</span> (美股 150 萬美元)。</li>
                <li><strong class="text-gray-500">排序權重：</strong>基本面優勢佔 30% + 資金流向優勢佔 40% + 起漲優勢佔 30% <span class="text-gray-500">(越接近 10% 分數越高，漲多則分數遞減)</span>。</li>
            `
        };

        // ==========================================
        // 工具函數
        // ==========================================
        function formatCopyTicker(ticker, market) {
            let t = String(ticker).trim();
            if (market === 'HK') {
                t = t.replace(/\.HK$/i, ''); 
                if (/^\d+$/.test(t)) t = t.padStart(4, '0'); 
                return t + '.HK';
            }
            return t; 
        }

        function formatMoney(value) {
            if (value == null || value === 0) return '-';
            const num = Number(value);
            const absNum = Math.abs(num);
            if (absNum >= 1000000) return (num / 1000000).toFixed(1) + ' M';
            if (absNum >= 10000) return (num / 10000).toFixed(1) + ' 萬';
            return num.toFixed(1);
        }

        function formatPct(value) {
            if (value == null || isNaN(value)) return '-';
            return (Number(value) * 100).toFixed(1) + '%';
        }

        // ==========================================
        // UI 互動事件
        // ==========================================
        window.switchTab = function(market) {
            activeMarket = market;
            document.querySelectorAll('.market-tab').forEach(tab => {
                tab.className = 'market-tab px-6 py-3 text-sm font-bold transition-all bg-gray-100 text-gray-500 hover:bg-gray-50 hover:text-gray-700 border-b border-gray-200 rounded-t-lg';
            });
            const activeTab = document.getElementById(`tab-${market.toLowerCase()}`);
            activeTab.className = 'market-tab px-6 py-3 text-sm font-bold transition-all bg-white text-blue-700 border-t-2 border-blue-600 border-x border-gray-200 rounded-t-lg z-10 -mb-px';
            executeScreenerLogic();
        };

        window.switchStrategy = function(strategy) {
            activeStrategy = strategy;
            document.getElementById('strategy-desc').innerHTML = strategyTexts[strategy];
            const scoreHeader = document.getElementById('score-header');
            
            if (strategy === 'short_term') {
                scoreHeader.textContent = '短線動能分';
                scoreHeader.className = 'py-4 px-6 text-right font-bold text-orange-600 text-base';
            } else if (strategy === 'long_term') {
                scoreHeader.textContent = '長線價值分';
                scoreHeader.className = 'py-4 px-6 text-right font-bold text-indigo-700 text-base';
            } else if (strategy === '52w_low') {
                scoreHeader.textContent = '起漲追擊分';
                scoreHeader.className = 'py-4 px-6 text-right font-bold text-blue-700 text-base';
            }
            executeScreenerLogic();
        };

        document.getElementById('strategy-desc').innerHTML = strategyTexts[activeStrategy];

        // ==========================================
        // 資料庫抓取與核心邏輯
        // ==========================================
        async function fetchLatestDatesAndSetPickers() {
            const [{ data: hkDateData }, { data: usDateData }] = await Promise.all([
                supabaseClient.from(TABLE_FLOW_HK).select('Record_Date').order('Record_Date', { ascending: false }).limit(1),
                supabaseClient.from(TABLE_FLOW_US).select('Record_Date').order('Record_Date', { ascending: false }).limit(1)
            ]);
            if (hkDateData && hkDateData.length > 0) hkDatePicker.value = String(hkDateData[0].Record_Date).slice(0, 10);
            if (usDateData && usDateData.length > 0) usDatePicker.value = String(usDateData[0].Record_Date).slice(0, 10);
        }

        async function fetchFlowDataByDate() {
            document.getElementById('stock-table-body').innerHTML = `<tr><td colspan="10" class="p-8 text-center text-blue-600 font-bold text-base animate-pulse">🔄 正在同時抓取資金流與基本面數據...</td></tr>`;
            try {
                const multiColumns = 'ticker, pe_ratio, dividend_yield, value_rating, roe, current_price, sma200, rsi, kdj_j, money_flow_million, money_flow_5d_million, money_flow_10d_million, week_52_low, avg_vol_10d_million';
                
                const [flowHkRes, flowUsRes, multiHkRes, multiUsRes] = await Promise.all([
                    supabaseClient.from(TABLE_FLOW_HK).select('*').eq('Record_Date', hkDatePicker.value).limit(3000),
                    supabaseClient.from(TABLE_FLOW_US).select('*').eq('Record_Date', usDatePicker.value).limit(3000),
                    supabaseClient.from(TABLE_MULTI_HK).select(multiColumns).eq('trading_date', hkDatePicker.value).limit(3000),
                    supabaseClient.from(TABLE_MULTI_US).select(multiColumns).eq('trading_date', usDatePicker.value).limit(3000)
                ]);

                const multiHkMap = {};
                (multiHkRes.data || []).forEach(r => multiHkMap[r.ticker] = r);
                const multiUsMap = {};
                (multiUsRes.data || []).forEach(r => multiUsMap[r.ticker] = r);

                const hkData = (flowHkRes.data || []).map(r => ({ ...r, market: 'HK', multi: multiHkMap[r.ticker] || {} }));
                const usData = (flowUsRes.data || []).map(r => ({ ...r, market: 'US', multi: multiUsMap[r.ticker] || {} }));
                
                latestMarketData = [...hkData, ...usData];
                executeScreenerLogic();
            } catch (err) {
                console.error(err);
                document.getElementById('stock-table-body').innerHTML = `<tr><td colspan="10" class="p-8 text-center text-red-500 font-bold">❌ 獲取數據失敗，請檢查網路或金鑰設定。</td></tr>`;
            }
        }

        function executeScreenerLogic() {
            const searchTerm = searchInput.value.trim().toUpperCase();

            // 1. 初步過濾
            let rawFiltered = latestMarketData.filter(r => {
                if (r.market !== activeMarket) return false;
                
                const f5 = Number(r.multi.money_flow_5d_million) || 0;
                const f10 = Number(r.multi.money_flow_10d_million) || 0;
                
                const mfi = r.MFI != null ? Number(r.MFI) : 100;
                const valRating = Number(r.multi.value_rating) || 0;
                const roe = Number(r.multi.roe) || 0;
                const rsi = Number(r.multi.rsi) || 100;
                const kdj_j = Number(r.multi.kdj_j) || 100;
                const sma200 = Number(r.multi.sma200) || 0;
                const price = Number(r.multi.current_price) || Number(r.price) || 0;
                
                const week52Low = Number(r.multi.week_52_low) || 0;
                const dist52WLow = week52Low > 0 ? ((price - week52Low) / week52Low) * 100 : -1;
                
                // 10日平均成交量 (百萬股) -> 轉換為真實成交金額 (百萬)
                const avgVol10D = Number(r.multi.avg_vol_10d_million) || 0;
                const avgTurnover10D = price * avgVol10D; // 百萬金額
                const minTurnover = activeMarket === 'HK' ? 10 : 1.5; // 港股要求千萬HKD，美股要求150萬USD

                if (activeStrategy === 'short_term') {
                    // 短線：正流入 + MFI超賣 + Value防護
                    return f5 > 0 && f10 > 0 && mfi < 45 && valRating >= 3;
                } else if (activeStrategy === 'long_term') {
                    // 長線：回歸純粹的嚴格極限超賣 (RSI<40 AND KDJ<20 AND 跌破年線)
                    return valRating >= 3 && roe > 0.08 && rsi < 40 && kdj_j < 20 && sma200 > 0 && price < sma200;
                } else if (activeStrategy === '52w_low') {
                    // 新增：追擊 52W 低位 (10% ~ 30%) + 成交金額防護 (Turnover)
                    return valRating >= 3 && roe > 0.08 && dist52WLow >= 10 && dist52WLow <= 30 && avgTurnover10D > minTurnover;
                }
            });

            if (rawFiltered.length === 0) {
                filteredScreenerData = [];
                renderTable();
                return;
            }

            const maxF5 = Math.max(...rawFiltered.map(r => Number(r.multi.money_flow_5d_million) || 0), 1); 
            // 為長線與52W策略準備的 10D 資金流上下界 (用作相對排名)
            const minF10 = Math.min(...rawFiltered.map(r => Number(r.multi.money_flow_10d_million) || 0));
            const maxF10 = Math.max(...rawFiltered.map(r => Number(r.multi.money_flow_10d_million) || 0));
            const rangeF10 = maxF10 - minF10 === 0 ? 1 : maxF10 - minF10;

            // 2. 計分與組合資料
            let processedData = rawFiltered.map(r => {
                const f5 = Number(r.multi.money_flow_5d_million) || 0;
                const f10 = Number(r.multi.money_flow_10d_million) || 0;
                const f1 = Number(r.multi.money_flow_million) || 0; 
                
                const mfi = Number(r.MFI) || 100;
                const volSpike = Number(r.Volspike) || 0;
                const rsi = Number(r.multi.rsi) || 100;
                const kdj_j = Number(r.multi.kdj_j) || 100;
                const sma200 = Number(r.multi.sma200) || 0;
                
                const valRating = Number(r.multi.value_rating) || 0;
                const divYield = Number(r.multi.dividend_yield) || 0;
                const pe = Number(r.multi.pe_ratio) || 0;
                const roe = Number(r.multi.roe) || 0;
                const price = Number(r.multi.current_price) || Number(r.price) || 0;
                
                const week52Low = Number(r.multi.week_52_low) || 0;
                const dist52WLow = week52Low > 0 ? ((price - week52Low) / week52Low) * 100 : 0;

                let finalScore = 0;
                if (activeStrategy === 'short_term') {
                    const mfiScore = ((45 - Math.max(mfi, 15)) / 30) * 40; 
                    const flowScore = (f5 / maxF5) * 40;
                    const volScore = Math.min(volSpike / 2.0, 1) * 20;
                    finalScore = mfiScore + flowScore + volScore;
                } else if (activeStrategy === 'long_term') {
                    const valScore = (valRating / 5) * 30 + Math.min(divYield / 5.0, 1) * 10;
                    const flowScore = ((f10 - minF10) / rangeF10) * 30; 
                    const oversoldScore = Math.max(0, ((100 - rsi) / 100) * 30); 
                    finalScore = valScore + flowScore + oversoldScore;
                } else if (activeStrategy === '52w_low') {
                    // 52W 低位策略計分：基本面 (30%) + 資金 (40%) + 起漲點 (30%)
                    const valScore = (valRating / 5) * 30; 
                    const flowScore = ((f10 - minF10) / rangeF10) * 40; 
                    // 10% 拿滿 30 分，30% 拿 0 分
                    const distScore = Math.max(0, ((30 - dist52WLow) / 20) * 30);
                    finalScore = valScore + flowScore + distScore;
                }

                return {
                    ticker: String(r.ticker || r.Ticker || '').trim(),
                    market: r.market,
                    name: r.company_name || r.Company_Name || '未知',
                    sector: r.sector || r.Sector || '未分類',
                    price: price,
                    sma200: sma200,
                    week52Low: week52Low,
                    dist52WLow: dist52WLow,
                    mfi: mfi,
                    rsi: rsi,
                    kdj_j: kdj_j,
                    flow_1d: f1,
                    flow_5d: f5,
                    flow_10d: f10,
                    accel: String(r.accel || '').trim().toUpperCase(),
                    volSpike: volSpike,
                    pe: pe,
                    divYield: divYield,
                    valRating: valRating,
                    roe: roe,
                    score: finalScore
                };
            });

            if (searchTerm) {
                processedData = processedData.filter(s => s.ticker.toUpperCase().includes(searchTerm) || s.name.toUpperCase().includes(searchTerm));
            }

            processedData.sort((a, b) => {
                if (Math.abs(b.score - a.score) > 0.1) return b.score - a.score;
                return activeStrategy === 'short_term' ? b.flow_5d - a.flow_5d : b.flow_10d - a.flow_10d; 
            });

            filteredScreenerData = processedData;
            renderTable();
        }

        // ==========================================
        // 渲染表格
        // ==========================================
        function renderTable() {
            const tbody = document.getElementById('stock-table-body');
            document.getElementById('match-count').textContent = `符合條件: ${filteredScreenerData.length} 隻`;
            
            // 安全重置 Checkbox
            document.getElementById('selected-count').textContent = '0';
            const checkAllEl = document.getElementById('check-all');
            if(checkAllEl) checkAllEl.checked = false;
            
            tbody.innerHTML = '';

            if (filteredScreenerData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="p-8 text-center text-gray-500 text-base">今日無符合條件的股票。</td></tr>`;
                return;
            }

            let scoreColorClass = 'text-gray-800';
            if (activeStrategy === 'short_term') scoreColorClass = 'text-orange-600';
            if (activeStrategy === 'long_term') scoreColorClass = 'text-indigo-700';
            if (activeStrategy === '52w_low') scoreColorClass = 'text-blue-700';

            filteredScreenerData.forEach((stock) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50 transition-colors duration-150';
                
                let badgeHtml = '';
                if (stock.volSpike >= 1.5) {
                    badgeHtml += `<span class="bg-amber-100 text-amber-800 border border-amber-200 text-xs px-2.5 py-1 rounded-md font-bold mb-1.5 inline-block mr-1 shadow-sm">📈 ${stock.volSpike.toFixed(1)}x 爆量</span>`;
                }
                if (stock.accel === 'THIN') {
                    badgeHtml += `<span class="bg-gray-100 text-gray-600 border border-gray-300 text-xs px-2.5 py-1 rounded-md inline-block shadow-sm">靜悄悄 (Thin)</span>`;
                } else {
                    badgeHtml += `<span class="bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs px-2.5 py-1 rounded-md inline-block shadow-sm font-semibold">建倉中 (${stock.accel})</span>`;
                }

                const f10_5 = stock.flow_10d - stock.flow_5d;
                const f5_1 = stock.flow_5d - stock.flow_1d;
                const f1 = stock.flow_1d;
                const maxAbs = Math.max(Math.abs(f10_5), Math.abs(f5_1), Math.abs(f1), 1);
                
                const h1 = (f10_5 / maxAbs) * 12;
                const h2 = (f5_1 / maxAbs) * 12;
                const h3 = (f1 / maxAbs) * 12;

                const drawBar = (h, x) => {
                    let y, barH, color;
                    if (h > 0) { y = 15 - h; barH = h; color = '#10B981'; } 
                    else if (h < 0) { y = 15; barH = Math.abs(h); color = '#EF4444'; } 
                    else { y = 14; barH = 2; color = '#9CA3AF'; }
                    return `<rect x="${x}" y="${y}" width="12" height="${barH}" rx="1.5" fill="${color}" />`;
                };

                const sparklineSvg = `
                    <div class="flex items-center justify-center gap-3" title="歷史 3 階段資金演進：\n1. 前10至5D: ${formatMoney(f10_5)}\n2. 前5至1D: ${formatMoney(f5_1)}\n3. 今日1D: ${formatMoney(f1)}">
                        <span class="text-blue-800 font-mono font-bold w-16 text-right">${formatMoney(stock.flow_5d)}</span>
                        <svg class="w-16 h-8" viewBox="0 0 60 30" style="overflow: visible;">
                            <line x1="0" y1="15" x2="60" y2="15" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="2,2" />
                            ${drawBar(h1, 4)}   
                            ${drawBar(h2, 24)}  
                            ${drawBar(h3, 44)}  
                        </svg>
                    </div>
                `;

                const lookupSymbol = formatCopyTicker(stock.ticker, stock.market);

                const peText = stock.pe > 0 ? stock.pe.toFixed(1) : '<span class="text-gray-400">N/A</span>';
                const yieldText = stock.divYield > 0 ? stock.divYield.toFixed(2) + '%' : '<span class="text-gray-400">0.0%</span>';
                const valRatingText = stock.valRating > 0 ? `${stock.valRating}/5` : '<span class="text-gray-400">-</span>';
                const roeText = stock.roe !== 0 ? formatPct(stock.roe) : '<span class="text-gray-400">N/A</span>';

                let distText = '';
                if (stock.week52Low > 0) {
                    const distColor = (stock.dist52WLow >= 10 && stock.dist52WLow <= 30) ? 'text-blue-600 font-bold' : 'text-gray-500';
                    const sign = stock.dist52WLow > 0 ? '+' : '';
                    distText = `<br><span class="text-xs ${distColor} mt-1 inline-block bg-white px-2 py-0.5 border border-gray-100 rounded shadow-sm">${sign}${stock.dist52WLow.toFixed(1)}%</span>`;
                } else {
                    distText = `<br><span class="text-xs text-gray-400 mt-1 inline-block">N/A</span>`;
                }

                tr.innerHTML = `
                    <td class="py-4 px-5 text-center">
                        <input type="checkbox" class="stock-checkbox row-check" data-ticker="${lookupSymbol}">
                    </td>
                    <td class="py-4 px-5 align-top">
                        <div class="text-lg font-bold text-blue-900 font-mono tracking-tight">${stock.ticker}</div>
                        <div class="text-xs text-gray-500 font-sans mt-1 whitespace-normal break-words w-40 sm:w-48 leading-tight">${stock.name}</div>
                    </td>
                    <td class="py-4 px-5 align-top">
                        <span class="text-gray-500 text-xs block">${stock.sector}</span>
                        ${distText}
                    </td>
                    
                    <td class="py-4 px-5 text-center font-mono text-gray-700 text-sm whitespace-nowrap">
                        <span class="text-gray-500 text-xs mr-1">P/E:</span> <span class="font-semibold">${peText}</span><br>
                        <span class="text-gray-500 text-xs mr-1">Div:</span> <span class="text-purple-700 font-semibold">${yieldText}</span>
                    </td>
                    <td class="py-4 px-5 text-center font-mono text-gray-700 text-sm whitespace-nowrap">
                        <span class="text-gray-500 text-xs mr-1">Val:</span> <span class="text-orange-600 font-bold">${valRatingText}</span><br>
                        <span class="text-gray-500 text-xs mr-1">ROE:</span> <span class="font-semibold">${roeText}</span>
                    </td>

                    <td class="py-4 px-5 text-center font-mono font-bold text-gray-800 text-base">
                        ${stock.price.toFixed(2)}<br>
                        <span class="text-sm ${stock.price < stock.sma200 ? 'text-red-500' : 'text-gray-400'} font-normal">${stock.sma200.toFixed(2)}</span>
                    </td>
                    
                    <td class="py-4 px-5 text-center font-mono text-gray-700 text-xs whitespace-nowrap leading-relaxed border-x border-gray-100 bg-gray-50/50">
                        <span class="text-gray-500 mr-1">MFI:</span> <span class="font-bold text-sm ${stock.mfi < 45 ? 'text-teal-600' : 'text-gray-700'}">${stock.mfi.toFixed(1)}</span><br>
                        <span class="text-gray-500 mr-1">RSI:</span> <span class="font-bold text-sm ${stock.rsi < 40 ? 'text-teal-600' : 'text-gray-700'}">${stock.rsi.toFixed(1)}</span><br>
                        <span class="text-gray-500 mr-1">KDJ:</span> <span class="font-bold text-sm ${stock.kdj_j < 20 ? 'text-teal-600' : 'text-gray-700'}">${stock.kdj_j.toFixed(1)}</span>
                    </td>

                    <td class="py-4 px-5 text-center">${sparklineSvg}</td>
                    <td class="py-4 px-5 text-center">${badgeHtml}</td>
                    <td class="py-4 px-6 text-right font-mono ${scoreColorClass} font-black text-2xl pr-6">${stock.score.toFixed(1)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        const checkAllBtn = document.getElementById('check-all');
        const selectedCountSpan = document.getElementById('selected-count');

        checkAllBtn.addEventListener('change', (e) => {
            const rowChecks = document.querySelectorAll('.row-check');
            rowChecks.forEach(chk => chk.checked = e.target.checked);
            selectedCountSpan.textContent = document.querySelectorAll('.row-check:checked').length;
        });

        document.getElementById('stock-table-body').addEventListener('change', (e) => {
            if (e.target.classList.contains('row-check')) {
                const rowChecks = document.querySelectorAll('.row-check');
                const checkedCount = document.querySelectorAll('.row-check:checked').length;
                selectedCountSpan.textContent = checkedCount;
                checkAllBtn.checked = (checkedCount === rowChecks.length && rowChecks.length > 0);
            }
        });

        document.getElementById('btn-copy-selected').addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('.row-check:checked');
            if (checkedBoxes.length === 0) {
                alert("請先勾選要複製的股票！");
                return;
            }
            const tickers = Array.from(checkedBoxes).map(chk => chk.getAttribute('data-ticker')).join(';');
            navigator.clipboard.writeText(tickers).then(() => {
                const btn = document.getElementById('btn-copy-selected');
                const originalText = btn.innerHTML;
                btn.innerHTML = `✅ 成功複製 ${checkedBoxes.length} 隻`;
                btn.classList.replace('bg-gray-800', 'bg-green-600');
                btn.classList.replace('hover:bg-gray-700', 'hover:bg-green-700');
                setTimeout(() => { 
                    btn.innerHTML = originalText; 
                    btn.classList.replace('bg-green-600', 'bg-gray-800');
                    btn.classList.replace('hover:bg-green-700', 'hover:bg-gray-700');
                }, 2000);
            });
        });

        document.getElementById('btn-load-date').addEventListener('click', fetchFlowDataByDate);
        searchInput.addEventListener('input', executeScreenerLogic);

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchLatestDatesAndSetPickers();
            await fetchFlowDataByDate();
        });
    </script>
</body>
</html>
