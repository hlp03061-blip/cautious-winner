            `,
            'long_term': `
                <li><strong class="text-indigo-700">護城河條件：</strong>價值評分 Value Rating <span class="font-bold text-indigo-700">>= 3</span>，且 賺錢效率 ROE <span class="font-bold text-indigo-700">> 8%</span>。</li>

                <li><strong class="text-blue-700">底部右側起漲：</strong>現價距離 52 周低位介於 <span class="font-bold text-blue-700">10% ~ 30%</span> 之間。</li>

            `,
            'bazi_phase': `
                <li><strong class="text-emerald-700">即時推算：</strong>網頁前端即時計算每檔股票過去 5 日的資金連貫性與突破軌跡。</li>
                <li><strong class="text-emerald-700">篩選目標：</strong>僅顯示目前處於 <span class="font-bold bg-green-100 text-green-800 px-1 rounded">🌱 胎/養 (底部孕育)</span> 或 <span class="font-bold bg-blue-100 text-blue-800 px-1 rounded">🚀 長生 (右側起漲)</span> 的股票。</li>
                <li><strong class="text-emerald-700">過濾假長生：</strong>嚴格剔除近 5 日資金失血 (如9988) 或跌破短期均線的標的。</li>
                <li><strong class="text-gray-500">提示：</strong>您可以透過這個清單，驗證我們討論的十二長生定義是否能精準抓出有生命力的轉折股。</li>
            `
        };

        // ==========================================
        // 前端動態計算：十二長生狀態 (5日演進邏輯)
        // ==========================================
        function calculateBaZiPhase(s) {
            // 1. ⚡ 絕 (Exhaustion) - 恐慌拋售極值
            if (s.price < s.sma200 && s.rsi < 35 && s.kdj_j < 20) {
                return { label: '⚡ 絕 (極度超賣)', class: 'bg-purple-100 text-purple-800 border-purple-200' };
            }
            
            // 2. 🍂 衰 / 病 (Decay) - 原本在高檔，但短線跌破且資金失血 (過濾假長生，如9988)
            if (s.price < s.sma20 && s.flow_5d < 0 && s.price > s.sma200) {
                return { label: '🍂 衰/病 (動能衰退)', class: 'bg-orange-100 text-orange-800 border-orange-200' };
            }
            
            // 3. 🚀 長生 (Breakout) - 剛站上月線，資金流入，MACD為正
            if (s.price > s.sma20 && s.flow_5d > 0 && s.macd > 0 && s.price < s.sma200 * 1.1) {
                return { label: '🚀 長生 (右側起漲)', class: 'bg-blue-100 text-blue-800 border-blue-200' };
            }
            
            // 4. 🌱 胎 / 養 (Nourishing) - 還在年線下，但資金已經連續正流入且有背離/動能
            if (s.price < s.sma200 && s.flow_5d > 0 && (s.obvDiv || s.macd > -0.5)) {
                return { label: '🌱 胎/養 (底部孕育)', class: 'bg-green-100 text-green-800 border-green-200' };
            }
            
            // 5. 🔥 帝旺/臨官 (Uptrend) - 完美多頭排列
            if (s.price > s.sma20 && s.price > s.sma50 && s.price > s.sma200 && s.macd > 0) {
                 return { label: '🔥 帝旺/臨官 (強勢多頭)', class: 'bg-red-100 text-red-800 border-red-200' };
            }
            
            // 6. 🪦 死 / 墓 (Dormant) - 均線之下且資金失血休眠
            if (s.price < s.sma50 && s.price < s.sma200 && s.flow_5d <= 0) {
                return { label: '🪦 死/墓 (空頭沉睡)', class: 'bg-gray-200 text-gray-700 border-gray-300' };
            }
            
            // Default
            return { label: '🔄 轉換/震盪期', class: 'bg-gray-50 text-gray-500 border-gray-200' };
        }

        // ==========================================
        // 工具函數
        // ==========================================
        function formatCopyTicker(ticker, market) {
            let t = String(ticker).trim();
            if (market === 'HK') {
                t = t.replace(/\.HK$/i, ''); 
                if (/^\d+$/.test(t)) t = t.padStart(4, '0'); 
                return t + '.HK';
            }
            return t; 
        }

        function formatMoney(value) {
            if (value == null || value === 0) return '-';
            const num = Number(value);
            const absNum = Math.abs(num);
            if (absNum >= 1000000) return (num / 1000000).toFixed(1) + ' M';
            if (absNum >= 10000) return (num / 10000).toFixed(1) + ' 萬';
            return num.toFixed(1);
        }

        function formatPct(value) {
            if (value == null || isNaN(value)) return '-';
            return (Number(value) * 100).toFixed(1) + '%';
        }

            try {
                const multiColumns = 'ticker, pe_ratio, dividend_yield, value_rating, roe, current_price, sma20, sma50, sma200, rsi, kdj_j, macd, obv_divergence, money_flow_million, money_flow_5d_million, money_flow_10d_million, week_52_low, avg_vol_10d_million';
                
                const [flowHkRes, flowUsRes, multiHkRes, multiUsRes] = await Promise.all([
                    supabaseClient.from(TABLE_FLOW_HK).select('*').eq('Record_Date', hkDatePicker.value).limit(3000),
                    supabaseClient.from(TABLE_FLOW_US).select('*').eq('Record_Date', usDatePicker.value).limit(3000),
                    supabaseClient.from(TABLE_MULTI_HK).select(multiColumns).eq('trading_date', hkDatePicker.value).limit(3000),
                    supabaseClient.from(TABLE_MULTI_US).select(multiColumns).eq('trading_date', usDatePicker.value).limit(3000)
                ]);

                const multiHkMap = {};
                (multiHkRes.data || []).forEach(r => multiHkMap[r.ticker] = r);
                const multiUsMap = {};
                (multiUsRes.data || []).forEach(r => multiUsMap[r.ticker] = r);

                const hkData = (flowHkRes.data || []).map(r => ({ ...r, market: 'HK', multi: multiHkMap[r.ticker] || {} }));
                const usData = (flowUsRes.data || []).map(r => ({ ...r, market: 'US', multi: multiUsMap[r.ticker] || {} }));
                
                latestMarketData = [...hkData, ...usData];
                executeScreenerLogic();
            } catch (err) {
                console.error(err);
                document.getElementById('stock-table-body').innerHTML = `<tr><td colspan="11" class="p-8 text-center text-red-500 font-bold">❌ 獲取數據失敗，請檢查網路或金鑰設定。</td></tr>`;
            }
        }

        function processStockRecord(r) {
            const f5 = Number(r.multi.money_flow_5d_million) || 0;
            const f10 = Number(r.multi.money_flow_10d_million) || 0;
            const f1 = Number(r.multi.money_flow_million) || 0; 
            
            const mfi = r.MFI != null ? Number(r.MFI) : 100;
            const volSpike = Number(r.Volspike) || 0;
            const rsi = Number(r.multi.rsi) || 100;
            const kdj_j = Number(r.multi.kdj_j) || 100;
            const sma20 = Number(r.multi.sma20) || 0;
            const sma50 = Number(r.multi.sma50) || 0;
            const sma200 = Number(r.multi.sma200) || 0;
            const macd = Number(r.multi.macd) || 0;
            const obvDiv = r.multi.obv_divergence === 'Yes';
            
            const valRating = Number(r.multi.value_rating) || 0;
            const divYield = Number(r.multi.dividend_yield) || 0;
            const pe = Number(r.multi.pe_ratio) || 0;
            const roe = Number(r.multi.roe) || 0;
            const price = Number(r.multi.current_price) || Number(r.price) || 0;
            const week52Low = Number(r.multi.week_52_low) || 0;
            const dist52WLow = week52Low > 0 ? ((price - week52Low) / week52Low) * 100 : -1;
            const avgVol10D = Number(r.multi.avg_vol_10d_million) || 0;
            const avgTurnover10D = price * avgVol10D; 

            let stockObj = {
                raw: r,
                ticker: String(r.ticker || r.Ticker || '').trim(),
                market: r.market, name: r.company_name || r.Company_Name || '未知', sector: r.sector || r.Sector || '未分類',
                price, sma20, sma50, sma200, macd, obvDiv,
                week52Low, dist52WLow, avgTurnover10D,
                mfi, rsi, kdj_j, flow_1d: f1, flow_5d: f5, flow_10d: f10,
                accel: String(r.accel || '').trim().toUpperCase(),
                volSpike, pe, divYield, valRating, roe, score: 0
            };

            // 運算十二長生標籤
            stockObj.bazi = calculateBaZiPhase(stockObj);
            return stockObj;
        }

        function executeScreenerLogic() {
            const searchTerm = searchInput.value.trim().toUpperCase();
            let allProcessed = latestMarketData.filter(r => r.market === activeMarket).map(processStockRecord);
            const minTurnover = activeMarket === 'HK' ? 10 : 1.5; 

            let holdingData = allProcessed.filter(s => userLists[s.ticker] === 'holding');
            let watchlistData = allProcessed.filter(s => userLists[s.ticker] === 'watchlist');

            let rawFiltered = allProcessed.filter(s => {
                if (userLists[s.ticker]) return false;

                if (activeStrategy === 'short_term') {
                    return s.flow_5d > 0 && s.flow_10d > 0 && s.mfi < 45 && s.valRating >= 3;
                } else if (activeStrategy === 'long_term') {
                    return s.valRating >= 3 && s.roe > 0.08 && s.rsi < 40 && s.kdj_j < 20 && s.sma200 > 0 && s.price < s.sma200;
                } else if (activeStrategy === '52w_low') {
                    const baseCondition = s.valRating >= 3 && s.roe > 0.08 && s.dist52WLow >= 10 && s.dist52WLow <= 30 && s.avgTurnover10D > minTurnover;
                    if (activeMarket === 'HK') return baseCondition && s.divYield >= 3;
                    if (activeMarket === 'US') return baseCondition && s.flow_5d > 0;
                    return false;
                } else if (activeStrategy === 'bazi_phase') {
                    // 🔮 八字策略：只挑選「胎/養」與「長生」，且成交量不能是死水
                    const isFetusOrBirth = s.bazi.label.includes('胎/養') || s.bazi.label.includes('長生');
                    return isFetusOrBirth && s.avgTurnover10D > minTurnover;
                }
            });

            // 分數計算
            const maxF5 = Math.max(...allProcessed.map(s => s.flow_5d), 1); 
            const minF10 = Math.min(...allProcessed.map(s => s.flow_10d));
            const maxF10 = Math.max(...allProcessed.map(s => s.flow_10d));
            const rangeF10 = maxF10 - minF10 === 0 ? 1 : maxF10 - minF10;

            const calcScore = (s) => {
                let finalScore = 0;
                if (activeStrategy === 'short_term') {
                    finalScore = ((45 - Math.max(s.mfi, 15)) / 30) * 40 + (s.flow_5d / maxF5) * 40 + Math.min(s.volSpike / 2.0, 1) * 20;
                } else if (activeStrategy === 'long_term') {
                    finalScore = (s.valRating / 5) * 30 + Math.min(s.divYield / 5.0, 1) * 10 + ((s.flow_10d - minF10) / rangeF10) * 30 + Math.max(0, ((100 - s.rsi) / 100) * 30);
                } else if (activeStrategy === '52w_low') {
                    finalScore = (s.valRating / 5) * 30 + ((s.flow_10d - minF10) / rangeF10) * 40 + Math.max(0, ((30 - s.dist52WLow) / 20) * 30);
                } else if (activeStrategy === 'bazi_phase') {
                    finalScore = ((s.flow_10d - minF10) / rangeF10) * 50 + ((s.flow_5d - Math.min(...allProcessed.map(x=>x.flow_5d))) / (maxF5 - Math.min(...allProcessed.map(x=>x.flow_5d)))) * 50;
                }
                s.score = finalScore || 0;
            };

            holdingData.forEach(calcScore);
            watchlistData.forEach(calcScore);
            rawFiltered.forEach(calcScore);

            if (searchTerm) {
                holdingData = holdingData.filter(s => s.ticker.toUpperCase().includes(searchTerm) || s.name.toUpperCase().includes(searchTerm));
                watchlistData = watchlistData.filter(s => s.ticker.toUpperCase().includes(searchTerm) || s.name.toUpperCase().includes(searchTerm));
                rawFiltered = rawFiltered.filter(s => s.ticker.toUpperCase().includes(searchTerm) || s.name.toUpperCase().includes(searchTerm));
            }

            const sortFunc = (a, b) => {
                if (Math.abs(b.score - a.score) > 0.1) return b.score - a.score;
                return activeStrategy === 'short_term' ? b.flow_5d - a.flow_5d : b.flow_10d - a.flow_10d; 
            };
            holdingData.sort(sortFunc);
            watchlistData.sort(sortFunc);
            rawFiltered.sort(sortFunc);

            filteredScreenerData = rawFiltered; 
            renderTable(holdingData, watchlistData, rawFiltered);
        }

        // ==========================================
        // 渲染表格 (動態三層結構)
        // ==========================================
        function renderTable(holdingData, watchlistData, screenedData) {
            const tbody = document.getElementById('stock-table-body');
            document.getElementById('match-count').textContent = `符合條件: ${screenedData.length} 隻`;
            document.getElementById('selected-count').textContent = '0';
            if(document.getElementById('check-all')) document.getElementById('check-all').checked = false;
            tbody.innerHTML = '';

            if (holdingData.length === 0 && watchlistData.length === 0 && screenedData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-8 text-center text-gray-500 text-base">目前無任何清單，且無符合條件的篩選結果。</td></tr>`;
                return;
            }

            let scoreColorClass = 'text-gray-800';
            if (activeStrategy === 'short_term') scoreColorClass = 'text-orange-600';
            if (activeStrategy === 'long_term') scoreColorClass = 'text-indigo-700';
            if (activeStrategy === '52w_low') scoreColorClass = 'text-blue-700';
            if (activeStrategy === 'bazi_phase') scoreColorClass = 'text-emerald-700';

            const createRowHtml = (stock, category) => {
                const tr = document.createElement('tr');
                const isHolding = category === 'holding';
                const isWatchlist = category === 'watchlist';
                
                let rowBgClass = 'hover:bg-blue-50 border-b border-gray-100 transition-colors duration-150';
                if (isHolding) rowBgClass = 'bg-yellow-50/60 hover:bg-yellow-100/70 border-b border-yellow-200 transition-colors duration-150';
                else if (isWatchlist) rowBgClass = 'bg-teal-50/40 hover:bg-teal-100/60 border-b border-teal-100 transition-colors duration-150';
                tr.className = rowBgClass;

                const holdingClass = isHolding ? 'btn-active text-yellow-600' : 'btn-inactive text-gray-500';
                const watchlistClass = isWatchlist ? 'btn-active text-teal-600' : 'btn-inactive text-gray-500';
                
                // 動態狀態標籤 + 爆量標籤
                let badgeHtml = `<span class="border text-xs px-2.5 py-1 rounded-md font-bold mb-1.5 inline-block mr-1 shadow-sm ${stock.bazi.class}">${stock.bazi.label}</span><br>`;
                
                if (stock.volSpike >= 1.5) {
                    badgeHtml += `<span class="bg-amber-100 text-amber-800 border border-amber-200 text-xs px-2.5 py-1 rounded-md font-bold mb-1.5 inline-block mr-1 shadow-sm">📈 ${stock.volSpike.toFixed(1)}x 爆量</span>`;
                }

                const f10_5 = stock.flow_10d - stock.flow_5d;
                const f5_1 = stock.flow_5d - stock.flow_1d;
                const f1 = stock.flow_1d;
                const maxAbs = Math.max(Math.abs(f10_5), Math.abs(f5_1), Math.abs(f1), 1);
                const drawBar = (h, x) => {
                    let y, barH, color;
                    if (h > 0) { y = 15 - h; barH = h; color = '#10B981'; } 
                    else if (h < 0) { y = 15; barH = Math.abs(h); color = '#EF4444'; } 
                    else { y = 14; barH = 2; color = '#9CA3AF'; }
                    return `<rect x="${x}" y="${y}" width="12" height="${barH}" rx="1.5" fill="${color}" />`;
                };

                const sparklineSvg = `
                    <div class="flex items-center justify-center gap-3" title="歷史 3 階段資金演進：\n1. 前10至5D: ${formatMoney(f10_5)}\n2. 前5至1D: ${formatMoney(f5_1)}\n3. 今日1D: ${formatMoney(f1)}">
                        <span class="text-blue-800 font-mono font-bold w-16 text-right">${formatMoney(stock.flow_5d)}</span>
                        <svg class="w-16 h-8" viewBox="0 0 60 30" style="overflow: visible;">
                            <line x1="0" y1="15" x2="60" y2="15" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="2,2" />
                            ${drawBar((f10_5/maxAbs)*12, 4)}   
                            ${drawBar((f5_1/maxAbs)*12, 24)}  
                            ${drawBar((f1/maxAbs)*12, 44)}  
                        </svg>
                    </div>
                `;

                const lookupSymbol = formatCopyTicker(stock.ticker, stock.market);
                const peText = stock.pe > 0 ? stock.pe.toFixed(1) : '<span class="text-gray-400">N/A</span>';
                const yieldText = stock.divYield > 0 ? stock.divYield.toFixed(2) + '%' : '<span class="text-gray-400">0.0%</span>';
                const valRatingText = stock.valRating > 0 ? `${stock.valRating}/5` : '<span class="text-gray-400">-</span>';
                const roeText = stock.roe !== 0 ? formatPct(stock.roe) : '<span class="text-gray-400">N/A</span>';
                
                let distText = stock.week52Low > 0 
                    ? `<span class="text-xs ${(stock.dist52WLow >= 10 && stock.dist52WLow <= 30) ? 'text-blue-600 font-bold' : 'text-gray-500'} mt-0.5 inline-block bg-white px-2 py-0.5 border border-gray-100 rounded shadow-sm">${stock.dist52WLow > 0 ? '+' : ''}${stock.dist52WLow.toFixed(1)}%</span>`
                    : `<span class="text-xs text-gray-400 mt-0.5 inline-block">N/A</span>`;

                tr.innerHTML = `
                    <td class="py-4 px-2 text-center w-20 border-r border-gray-100">
                        <div class="flex items-center justify-center gap-3 text-[1.35rem]">
                            <span class="action-btn ${holdingClass}" title="設為持倉" onclick="toggleList('${stock.ticker}', 'holding')">💼</span>
                            <span class="action-btn ${watchlistClass}" title="加入監察" onclick="toggleList('${stock.ticker}', 'watchlist')">👀</span>
                        </div>
                    </td>
                    <td class="py-4 px-3 text-center"><input type="checkbox" class="stock-checkbox row-check" data-ticker="${lookupSymbol}"></td>
                    <td class="py-4 px-5">
                        <div class="text-lg font-bold ${isHolding ? 'text-yellow-800' : (isWatchlist ? 'text-teal-800' : 'text-blue-900')} font-mono tracking-tight">${stock.ticker}</div>
                        <div class="text-xs text-gray-500 font-sans mt-1 whitespace-normal break-words w-40 sm:w-48 leading-tight">${stock.name}</div>
                    </td>
                    <td class="py-4 px-5"><span class="text-gray-500 text-xs block">${stock.sector}</span>${distText}</td>
                    <td class="py-4 px-5 text-center font-mono text-gray-700 text-sm whitespace-nowrap">
                        <span class="text-gray-500 text-xs mr-1">P/E:</span> <span class="font-semibold">${peText}</span><br>
                        <span class="text-gray-500 text-xs mr-1">Div:</span> <span class="text-purple-700 font-semibold">${yieldText}</span>
                    </td>
                    <td class="py-4 px-5 text-center font-mono text-gray-700 text-sm whitespace-nowrap">
                        <span class="text-gray-500 text-xs mr-1">Val:</span> <span class="text-orange-600 font-bold">${valRatingText}</span><br>
                        <span class="text-gray-500 text-xs mr-1">ROE:</span> <span class="font-semibold">${roeText}</span>
                    </td>
                    <td class="py-4 px-5 text-center font-mono font-bold text-gray-800 text-base leading-tight">
                        ${stock.price.toFixed(2)}<br>
                        <span class="text-sm ${stock.price < stock.sma20 ? 'text-red-500 font-bold' : 'text-gray-400'} font-normal">M: ${stock.sma20.toFixed(2)}</span>
                    </td>
                    <td class="py-4 px-5 text-center font-mono text-gray-700 text-xs whitespace-nowrap leading-relaxed border-x border-gray-100 ${isHolding ? 'bg-yellow-100/40' : (isWatchlist ? 'bg-teal-50/60' : 'bg-gray-50/50')}">
                        <span class="text-gray-500 mr-1">MFI:</span> <span class="font-bold text-sm ${stock.mfi < 45 ? 'text-teal-600' : 'text-gray-700'}">${stock.mfi.toFixed(1)}</span><br>
                        <span class="text-gray-500 mr-1">RSI:</span> <span class="font-bold text-sm ${stock.rsi < 40 ? 'text-teal-600' : 'text-gray-700'}">${stock.rsi.toFixed(1)}</span><br>
                        <span class="text-gray-500 mr-1">KDJ:</span> <span class="font-bold text-sm ${stock.kdj_j < 20 ? 'text-teal-600' : 'text-gray-700'}">${stock.kdj_j.toFixed(1)}</span>
                    </td>
                    <td class="py-4 px-5 text-center">${sparklineSvg}</td>
                    <td class="py-4 px-5 text-center leading-relaxed">${badgeHtml}</td>
                    <td class="py-4 px-6 text-right font-mono ${scoreColorClass} font-black text-2xl pr-6">${stock.score.toFixed(1)}</td>
                `;
                return tr;
            };

            if (holdingData.length > 0) holdingData.forEach(stock => tbody.appendChild(createRowHtml(stock, 'holding')));
            
            if (watchlistData.length > 0) {
                const sep1 = document.createElement('tr');
                sep1.innerHTML = `<td colspan="11" class="text-center font-bold bg-teal-100/60 py-2 text-teal-800 text-sm tracking-widest shadow-inner border-y border-teal-200">👀 您的監察名單 👀</td>`;
                tbody.appendChild(sep1);
                watchlistData.forEach(stock => tbody.appendChild(createRowHtml(stock, 'watchlist')));
            }

            if (screenedData.length > 0) {
                const sep2 = document.createElement('tr');
                sep2.innerHTML = `<td colspan="11" class="text-center font-bold bg-gray-200/80 py-2.5 text-gray-600 text-sm tracking-widest shadow-inner border-y border-gray-300">👇 最新策略篩選結果 👇</td>`;
                tbody.appendChild(sep2);
                screenedData.forEach(stock => tbody.appendChild(createRowHtml(stock, 'screened')));
            }
        }

        const checkAllBtn = document.getElementById('check-all');
        const selectedCountSpan = document.getElementById('selected-count');

        checkAllBtn.addEventListener('change', (e) => {
            const rowChecks = document.querySelectorAll('.row-check');
            rowChecks.forEach(chk => chk.checked = e.target.checked);
            selectedCountSpan.textContent = document.querySelectorAll('.row-check:checked').length;
        });

        document.getElementById('stock-table-body').addEventListener('change', (e) => {
            if (e.target.classList.contains('row-check')) {
                const rowChecks = document.querySelectorAll('.row-check');
                const checkedCount = document.querySelectorAll('.row-check:checked').length;
                selectedCountSpan.textContent = checkedCount;
                checkAllBtn.checked = (checkedCount === rowChecks.length && rowChecks.length > 0);
            }
        });

        document.getElementById('btn-copy-selected').addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('.row-check:checked');
            if (checkedBoxes.length === 0) { alert("請先勾選要複製的股票！"); return; }
            const tickers = Array.from(checkedBoxes).map(chk => chk.getAttribute('data-ticker')).join(';');
            navigator.clipboard.writeText(tickers).then(() => {
                const btn = document.getElementById('btn-copy-selected');
                const originalText = btn.innerHTML;
                btn.innerHTML = `✅ 成功複製 ${checkedBoxes.length} 隻`;
                btn.classList.replace('bg-gray-800', 'bg-green-600');
                btn.classList.replace('hover:bg-gray-700', 'hover:bg-green-700');
                setTimeout(() => { 
                    btn.innerHTML = originalText; 
                    btn.classList.replace('bg-green-600', 'bg-gray-800');
                    btn.classList.replace('hover:bg-green-700', 'hover:bg-gray-700');
                }, 2000);
            });
        });

        document.getElementById('btn-load-date').addEventListener('click', fetchFlowDataByDate);
        searchInput.addEventListener('input', executeScreenerLogic);

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchLatestDatesAndSetPickers();
            await fetchFlowDataByDate();
        });
    </script>
</body>
</html>
