        const SUPABASE_URL = 'https://dfeqgzgjnkcinduhaqbx.supabase.co';

        const formatNum = (num, decimals = 2) => num !== null && num !== undefined && !isNaN(num) ? Number(num).toFixed(decimals) : 'N/A';
        const checkHighlight = (price, sma) => (price !== null && sma !== null && Number(price) > Number(sma)) ? 'text-green-600 font-bold bg-green-50' : '';
        const getFlowColor = (flow) => flow === null || flow === undefined ? 'text-gray-800' : (flow > 0 ? 'text-green-600' : (flow < 0 ? 'text-red-600' : 'text-gray-800'));
        const formatMoney = (v) => v ? (Math.abs(v) >= 1000000 ? (v/1000000).toFixed(1)+'M' : v.toFixed(1)) : '-';
        const formatPct = (v) => v ? (v*100).toFixed(1)+'%' : '-';

        function getCompareColorClass(curr, prev) {
            if (curr === null || prev === null || prev === undefined || curr === undefined) return '';
            const diff = Number(curr) - Number(prev);
            if (diff > 0) return 'text-blue-600 font-bold';
            if (diff < 0) return 'text-orange-500 font-bold';
            return '';
        }

        function getCompareHtml(curr, prev, decimals = 2, mode = 'pct') {
            const valStr = formatNum(curr, decimals);
            if (curr === null || prev === null || prev === undefined || curr === undefined) return `<div class="flex flex-col items-end"><span>${valStr}</span><span class="text-[11px] text-transparent select-none">(-)</span></div>`;
            const diff = Number(curr) - Number(prev);
            if (Math.abs(diff) < 0.0001) return `<div class="flex flex-col items-end"><span>${valStr}</span><span class="text-[11px] text-gray-400">(-)</span></div>`;
            const isUp = diff > 0;
            const sign = isUp ? '▲' : '▼';
            const colorCls = isUp ? 'text-blue-600' : 'text-orange-500';
            let diffStr = mode === 'pct' ? `${sign} ${(prev !== 0 ? (Math.abs(diff) / Math.abs(prev)) * 100 : 0).toFixed(1)}%` : `${sign} ${Math.abs(diff).toFixed(decimals)}`;
            return `<div class="flex flex-col items-end"><span>${valStr}</span><span class="text-[11px] ${colorCls} font-bold leading-none mt-0.5">(${diffStr})</span></div>`;
        }

        function getTextCompareHtml(curr, prev, defaultVal = 'N/A', mainClasses = 'font-medium', containerClasses = '') {
            const c = curr || defaultVal;
            const p = prev || defaultVal;
            if (prev === undefined || c === p) return `<div class="flex flex-col items-end ${containerClasses}"><span class="${mainClasses}">${c}</span></div>`;
            return `<div class="flex flex-col items-end ${containerClasses}"><span class="${mainClasses}">${c}</span><span class="text-[11px] text-blue-600 font-bold leading-none mt-1">(昨日: ${p})</span></div>`;
        }

    <script>
        // ==========================================
        // 2. 狀態與核心邏輯
        // ==========================================
        let latestMarketData = [], userLists = {}, windowCache = {}; 
        let activeMarket = 'HK', activeStrategy = 'ultimate_resonance'; 
        window.clipboardDataMap = {}; 
        
        function getBaZiState(s) {
            const p = s.price, sma20 = s.sma20, sma200 = s.sma200;
            const rvol = s.rvol, rsi = s.rsi, kdj_j = s.kdj_j;
            const f5 = s.flow_5d, f10 = s.flow_10d, macd = s.macd;
            const obvDiv = s.obvDiv, preUp = s.preUp || '';

            if (rsi > 75 && kdj_j > 100) return { label: '🔥 帝旺', c: 'bg-orange-100 text-orange-800 border-orange-300 font-bold' };
            if (p > sma20 && rvol >= 1.5 && macd > 0) return { label: '🚀 長生 (爆量)', c: 'bg-red-100 text-red-700 border-red-300 font-black shadow-sm' };
            if (p > sma20) return { label: '🌳 生長', c: 'bg-green-100 text-green-800 border-green-200 font-medium' };
            if (p < sma200 && rsi < 30 && kdj_j < 0) return { label: '⚡ 絕', c: 'bg-slate-800 text-white border-slate-900 font-bold' };
            if (p <= sma20 && f5 > 0 && f10 > 0) return { label: '🍼 養', c: 'bg-lime-100 text-lime-800 border-lime-300 font-bold' };
            if (p < sma20 && (f5 > 0 || f10 > 0) && (obvDiv || preUp.includes('Squeeze') || preUp.includes('Accumulation'))) return { label: '🌱 胎', c: 'bg-pink-100 text-pink-800 border-pink-200 font-medium' };
            return { label: '🍂 衰/死', c: 'bg-gray-100 text-gray-500 border-gray-200' };
        }

        window.switchTab = (m) => { activeMarket = m; executeScreenerLogic(); };
        window.switchStrategy = (s) => { activeStrategy = s; executeScreenerLogic(); };
        
        window.toggleList = async (ticker, category) => {
            const current = userLists[ticker];
            if (current === category) {
                delete userLists[ticker];
                executeScreenerLogic();
                await supabaseClient.from('my_portfolio').delete().eq('ticker', ticker);
            } else {
                userLists[ticker] = category;
                executeScreenerLogic();
                await supabaseClient.from('my_portfolio').upsert({ ticker, category }, { onConflict: 'ticker' });
            }
        };

        window.copyToClipboard = (ticker) => {
            const tsvText = window.clipboardDataMap[ticker];
            if (tsvText) {
                navigator.clipboard.writeText(tsvText).then(() => alert(`${ticker} 的【完整數據報告】已複製！可直接貼上至 Excel。`))
                .catch(() => alert('複製失敗，請檢查瀏覽器權限。'));
            } else {
                alert('資料尚未載入完成。');
            }
        }

        async function fetchInitialData() {
            const [{ data: hD }, { data: uD }, { data: pD }] = await Promise.all([
                supabaseClient.from('money_flow_hk').select('Record_Date').order('Record_Date', { ascending: false }).limit(1),
                supabaseClient.from('money_flow_sp500').select('Record_Date').order('Record_Date', { ascending: false }).limit(1),
                supabaseClient.from('my_portfolio').select('ticker, category')
            ]);
            if(hD?.length) document.getElementById('hk-date').value = hD[0].Record_Date.slice(0,10);
            if(uD?.length) document.getElementById('us-date').value = uD[0].Record_Date.slice(0,10);
            userLists = {}; if(pD) pD.forEach(r => userLists[r.ticker] = r.category || 'watchlist');
        }

        async function fetchMacroData() {
            document.getElementById('stock-table-body').innerHTML = `<tr><td colspan="10" class="p-8 text-center text-blue-600 font-bold animate-pulse">🔄 正在抓取全市場巨觀數據...</td></tr>`;
            try {
                const multiCols = 'ticker, company_name, sector, current_price, sma20, sma200, macd, rsi, kdj_j, obv_divergence, pre_uptrend_signal, rvol, pe_ratio, dividend_yield, value_rating, roe, money_flow_million, money_flow_5d_million, money_flow_10d_million';
                
                const [mHK, mUS, mfHK, mfUS] = await Promise.all([
                    supabaseClient.from('multi_stock_analysis_hk').select(multiCols).eq('trading_date', document.getElementById('hk-date').value).limit(3000),
                    supabaseClient.from('multi_stock_analysis_sp500').select(multiCols).eq('trading_date', document.getElementById('us-date').value).limit(3000),
                    supabaseClient.from('money_flow_hk').select('ticker, MFI').eq('Record_Date', document.getElementById('hk-date').value).limit(3000),
                    supabaseClient.from('money_flow_sp500').select('ticker, MFI').eq('Record_Date', document.getElementById('us-date').value).limit(3000)
                ]);

                const mfiMapHK = {}; (mfHK.data||[]).forEach(r => mfiMapHK[r.ticker] = r.MFI);
                const mfiMapUS = {}; (mfUS.data||[]).forEach(r => mfiMapUS[r.ticker] = r.MFI);

                latestMarketData = [
                    ...(mHK.data||[]).map(r => ({...r, market: 'HK', mfi: mfiMapHK[r.ticker]})), 
                    ...(mUS.data||[]).map(r => ({...r, market: 'US', mfi: mfiMapUS[r.ticker]}))
                ];
                executeScreenerLogic();
            } catch (err) { console.error(err); }
        }

        function processStock(r) {
            return {
                ticker: r.ticker, market: r.market, name: r.company_name, sector: r.sector,
                price: r.current_price, sma20: r.sma20, sma200: r.sma200, macd: r.macd,
                mfi: r.mfi, rsi: r.rsi, kdj_j: r.kdj_j, rvol: r.rvol, obvDiv: r.obv_divergence === 'Yes', preUp: r.pre_uptrend_signal || '',
                flow_1d: r.money_flow_million||0, flow_5d: r.money_flow_5d_million||0, flow_10d: r.money_flow_10d_million||0,
                pe: r.pe_ratio||0, divYield: r.dividend_yield||0, valRating: r.value_rating||0, roe: r.roe||0, score: 0
            };
        }

        function executeScreenerLogic() {
            let all = latestMarketData.filter(r => r.market === activeMarket).map(processStock);
            all.forEach(s => s.bazi = getBaZiState(s));

            let holding = all.filter(s => userLists[s.ticker] === 'holding');
            let watchlist = all.filter(s => userLists[s.ticker] === 'watchlist');
            let filtered = all.filter(s => {
                if (userLists[s.ticker]) return false; 
                if (activeStrategy === 'short_term') return s.flow_5d > 0 && s.rsi < 40 && s.valRating >= 3;
                if (activeStrategy === 'long_term') return s.valRating >= 3 && s.rsi < 35 && s.price < s.sma200;
                if (activeStrategy === 'ultimate_resonance') return ['🌱 胎', '🍼 養', '🚀 長生 (爆量)'].includes(s.bazi.label) && s.valRating >= 3;
            });

            const sorter = (a, b) => b.flow_5d - a.flow_5d;
            holding.sort(sorter); watchlist.sort(sorter); filtered.sort(sorter);

            renderTable(holding, watchlist, filtered);
        }

        function renderTable(holding, watchlist, filtered) {
            const tbody = document.getElementById('stock-table-body');
            document.getElementById('match-count').innerText = `篩選結果: ${filtered.length} 隻`;
            tbody.innerHTML = '';

            const createRow = (s, category) => {
                const tr = document.createElement('tr');
                let bg = 'hover:bg-blue-50 border-b border-gray-100';
                if(category==='holding') bg = 'bg-yellow-50/60 hover:bg-yellow-100 border-b border-yellow-200';
                if(category==='watchlist') bg = 'bg-teal-50/40 hover:bg-teal-100 border-b border-teal-100';
                tr.className = bg;

                const holdCls = category === 'holding' ? 'btn-active text-yellow-600' : 'btn-inactive text-gray-500';
                const watchCls = category === 'watchlist' ? 'btn-active text-teal-600' : 'btn-inactive text-gray-500';

                const f10_5 = s.flow_10d - s.flow_5d;
                const f5_1 = s.flow_5d - s.flow_1d;
                const f1 = s.flow_1d;
                const maxAbs = Math.max(Math.abs(f10_5), Math.abs(f5_1), Math.abs(f1), 1);
                
                const drawBar = (val, x) => {
                    const h = Math.abs((val/maxAbs)*12);
                    return `<rect x="${x}" y="${val>0 ? 15-h : 15}" width="8" height="${h||2}" rx="1" fill="${val>0?'#10B981':'#EF4444'}" />`;
                };

                tr.innerHTML = `
                    <td class="py-3 px-2 text-center border-r border-gray-100">
                        <div class="flex justify-center gap-2 text-xl">
                            <span class="action-btn ${holdCls}" onclick="toggleList('${s.ticker}', 'holding')">💼</span>
                            <span class="action-btn ${watchCls}" onclick="toggleList('${s.ticker}', 'watchlist')">👀</span>
                        </div>
                    </td>
                    <td class="py-3 px-2 text-center"><input type="checkbox" class="stock-checkbox"></td>
                    <td class="py-3 px-4">
                        <div class="font-bold text-blue-900 font-mono tracking-tight text-base">${s.ticker}</div>
                        <div class="text-xs text-gray-500 truncate w-32">${s.name}</div>
                    </td>
                    <td class="py-3 px-4 text-center"><span class="px-2.5 py-1 text-xs border rounded-md shadow-sm ${s.bazi.c}">${s.bazi.label}</span></td>
                    <td class="py-3 px-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <svg class="w-12 h-8" viewBox="0 0 40 30" style="overflow:visible">
                                <line x1="0" y1="15" x2="40" y2="15" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="2,2" />
                                ${drawBar(f10_5, 2)} ${drawBar(f5_1, 16)} ${drawBar(f1, 30)}
                            </svg>
                        </div>
                    </td>
                    <td class="py-3 px-4 text-center font-mono text-xs">
                        <span class="${s.mfi < 45 ? 'text-teal-600 font-bold' : 'text-gray-500'}">MFI:${s.mfi ? s.mfi.toFixed(1) : 'N/A'}</span><br>
                        <span class="${s.rsi < 40 ? 'text-teal-600 font-bold' : 'text-gray-500'}">RSI:${s.rsi.toFixed(1)}</span><br>
                        <span class="${s.kdj_j < 20 ? 'text-teal-600 font-bold' : 'text-gray-500'}">KDJ:${s.kdj_j.toFixed(1)}</span>
                    </td>
                    <td class="py-3 px-4 text-center font-mono text-xs">
                        <span class="text-gray-500">P/E:</span> <span class="font-bold">${s.pe>0?s.pe.toFixed(1):'N/A'}</span><br>
                        <span class="text-gray-500">Div:</span> <span class="text-purple-700 font-bold">${s.divYield>0?s.divYield.toFixed(2)+'%':'0%'}</span>
                    </td>
                    <td class="py-3 px-4 text-center font-mono text-xs">
                        <span class="text-gray-500">Val:</span> <span class="text-orange-600 font-bold">${s.valRating>0?s.valRating+'/5':'-'}</span><br>
                        <span class="text-gray-500">ROE:</span> <span class="font-bold">${s.roe?formatPct(s.roe):'N/A'}</span>
                    </td>
                    <td class="py-3 px-4 text-right font-mono font-bold text-gray-800">${formatMoney(s.flow_5d)}</td>
                    <td class="py-3 px-4 text-center">
                        <button id="btn-analyze-${s.ticker}" onclick="toggleAnalysis('${s.ticker}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-1.5 px-3 rounded border border-indigo-200 transition">📊 分析</button>
                    </td>
                `;
                tbody.appendChild(tr);

                const expandTr = document.createElement('tr');
                expandTr.id = `expand-${s.ticker}`;
                expandTr.className = 'expansion-row';
                expandTr.innerHTML = `<td colspan="10" class="p-0"><div id="content-${s.ticker}"></div></td>`;
                tbody.appendChild(expandTr);
            };

            if(holding.length) { holding.forEach(s => createRow(s, 'holding')); }
            if(watchlist.length) {
                const sep = document.createElement('tr'); sep.innerHTML=`<td colspan="10" class="text-center font-bold bg-teal-100/60 py-2 text-teal-800 text-xs">👀 監察名單</td>`; tbody.appendChild(sep);
                watchlist.forEach(s => createRow(s, 'watchlist'));
            }
            if(filtered.length) {
                const sep = document.createElement('tr'); sep.innerHTML=`<td colspan="10" class="text-center font-bold bg-gray-200/80 py-2 text-gray-600 text-xs">👇 最新篩選結果</td>`; tbody.appendChild(sep);
                filtered.forEach(s => createRow(s, 'filtered'));
            }
        }

        // ==========================================
        // 5. 展開完整分析卡片
        // ==========================================
        window.toggleAnalysis = async (ticker) => {
            const row = document.getElementById(`expand-${ticker}`);
            const content = document.getElementById(`content-${ticker}`);
            const btn = document.getElementById(`btn-analyze-${ticker}`);
            
            if (row.classList.contains('open')) { 
                row.classList.remove('open'); 
                btn.innerHTML = '📊 分析';
                btn.className = 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-1.5 px-3 rounded border border-indigo-200 transition';
                return; 
            }
            
            document.querySelectorAll('.expansion-row.open').forEach(el => {
                el.classList.remove('open');
                const otherTicker = el.id.replace('expand-', '');
                const otherBtn = document.getElementById(`btn-analyze-${otherTicker}`);
                if(otherBtn) {
                    otherBtn.innerHTML = '📊 分析';
                    otherBtn.className = 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-1.5 px-3 rounded border border-indigo-200 transition';
                }
            });
            
            row.classList.add('open');
            btn.innerHTML = '🔼 收起';
            btn.className = 'bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold py-1.5 px-3 rounded border border-red-200 transition';

            if (windowCache[ticker]) return;

            content.innerHTML = `<div class="p-8 text-center animate-pulse text-indigo-600 font-bold">⏳ 正在為 ${ticker} 抓取完整分析報告...</div>`;

            try {
                const multiTable = activeMarket === 'HK' ? 'multi_stock_analysis_hk' : 'multi_stock_analysis_sp500';
                const mfTable = activeMarket === 'HK' ? 'money_flow_hk' : 'money_flow_sp500';
                
                // 修復遺漏的 mfRes：向資料庫抓取 money_flow 歷史數據
                const [multiRes, mfRes, sdRes] = await Promise.all([
                    supabaseClient.from(multiTable).select('*').eq('ticker', ticker).order('trading_date', { ascending: false }).limit(20),
                    supabaseClient.from(mfTable).select('ticker, MFI, Record_Date, money_flow_million').eq('ticker', ticker).order('Record_Date', { ascending: false }).limit(20),
                    supabaseClient.from('stock_data').select('*').eq('ticker', ticker).order('date', { ascending: false }).limit(1)
                ]);

                if (!multiRes.data || multiRes.data.length === 0) {
                    content.innerHTML = `<div class="p-8 text-red-500">無法取得歷史數據。</div>`; return;
                }

                const records = multiRes.data;
                const latest = records[0]; 
                const prevData = records.length > 1 ? records[1] : {};
                const sd = sdRes.data && sdRes.data.length > 0 ? sdRes.data[0] : {};
                
                const stockMacro = latestMarketData.find(x => x.ticker === ticker) || {};
                const mfiVal = stockMacro.mfi !== undefined && stockMacro.mfi !== null ? formatNum(stockMacro.mfi, 2) : 'N/A';

                const changePct = latest.change_pct;
                const changeColor = changePct > 0 ? 'text-green-600' : (changePct < 0 ? 'text-red-600' : 'text-gray-500');
                const changeSign = changePct > 0 ? '+' : '';
                const week52Low = Number(latest.week_52_low) || 0;
                let dist52WLowText = 'N/A';
                if (week52Low > 0) dist52WLowText = `+${(((Number(latest.current_price) - week52Low) / week52Low) * 100).toFixed(1)}%`;
                
                const mockObjForBazi = {
                    price: latest.current_price, sma20: latest.sma20, sma200: latest.sma200, rvol: latest.rvol, rsi: latest.rsi, kdj_j: latest.kdj_j,
                    flow_5d: latest.money_flow_5d_million, flow_10d: latest.money_flow_10d_million, macd: latest.macd, 
                    obvDiv: latest.obv_divergence === 'Yes', preUp: latest.pre_uptrend_signal || ''
                };
                const bazi = getBaZiState(mockObjForBazi);

                const headerHtml = `
                    <div class="flex justify-between items-center p-4 bg-gray-50 border-b border-gray-200">
                        <div class="flex-1">
                            <div class="flex items-center gap-6 mb-3">
                                <span class="text-xl font-bold text-blue-900 w-24">${ticker}</span>
                                <span class="text-sm text-gray-600 truncate w-32">${latest.company_name || 'N/A'}</span>
                                <span class="text-lg font-bold text-gray-800">${formatNum(latest.current_price, 3)}</span>
                                <span class="${changeColor} font-bold text-sm">${changeSign}${formatNum(changePct, 2)}%</span>
                                <span class="px-2.5 py-1 text-xs border rounded-md shadow-sm ${bazi.c} ml-4">${bazi.label}</span>
                            </div>
                            <div class="flex items-center gap-3 text-sm font-medium">
                                <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded shadow-sm">Sector: ${latest.sector || 'N/A'}</span>
                                <span class="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded shadow-sm">距52W低: ${dist52WLowText}</span>
                                <span class="px-3 py-1 bg-purple-100 text-purple-800 rounded shadow-sm">Val: ${latest.value_rating || 'N/A'}</span>
                                <span class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded shadow-sm">評級: ${sd.rating_hybrid || 'N/A'}</span>
                                <span class="px-3 py-1 bg-teal-100 text-teal-800 rounded shadow-sm">MFI: ${mfiVal}</span>
                                <span class="px-3 py-1 rounded shadow-sm ${latest.pre_uptrend_signal !== 'No' ? 'bg-yellow-100 text-red-600 font-bold border border-yellow-200' : 'bg-gray-100 text-gray-600'}">Signal: ${latest.pre_uptrend_signal || 'No'}</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2 text-sm text-right">
                            <span class="text-gray-500 text-xs">最後更新: ${latest.trading_date} <br> (${latest.market_status})</span>
                            <button onclick="toggleAnalysis('${ticker}')" class="text-xs text-blue-600 hover:text-blue-800 font-bold mt-1">🔼 收起卡片</button>
                        </div>
                    </div>
                `;

                let historyRows = "", moneyFlowDailyRows = "";
                records.forEach((row, i) => {
                    const px = row.close_price || row.current_price;
                    const prevR = records[i + 1] || {};
                    historyRows += `
                        <tr class="hover:bg-blue-50 text-sm">
                            <td class="text-center">${row.trading_date}</td>
                            <td>${formatNum(px, 3)}</td>
                            <td>${formatNum(row.open_price, 3)}</td>
                            <td>${formatNum(row.high_price, 3)}</td>
                            <td>${formatNum(row.low_price, 3)}</td>
                            <td>${formatNum(row.change_pct, 2)}%</td>
                            <td class="${getCompareColorClass(row.vol_million, prevR.vol_million)}">${formatNum(row.vol_million, 3)}</td>
                            <td class="${getCompareColorClass(row.rvol, prevR.rvol)}">${formatNum(row.rvol, 2)}</td>
                            <td class="${checkHighlight(px, row.sma5)}">${formatNum(row.sma5, 3)}</td>
                            <td class="${checkHighlight(px, row.sma10)}">${formatNum(row.sma10, 3)}</td>
                            <td class="${checkHighlight(px, row.sma20)}">${formatNum(row.sma20, 3)}</td>
                            <td class="${checkHighlight(px, row.sma50)}">${formatNum(row.sma50, 3)}</td>
                            <td class="${checkHighlight(px, row.sma200)}">${formatNum(row.sma200, 3)}</td>
                            <td class="${getCompareColorClass(row.macd, prevR.macd)}">${formatNum(row.macd, 3)}</td>
                            <td class="${getCompareColorClass(row.rsi, prevR.rsi)}">${formatNum(row.rsi, 2)}</td>
                            <td class="${getCompareColorClass(row.adx, prevR.adx)}">${formatNum(row.adx, 2)}</td>
                            <td class="${getCompareColorClass(row.kdj_k, prevR.kdj_k)}">${formatNum(row.kdj_k, 2)}</td>
                            <td class="${getCompareColorClass(row.kdj_d, prevR.kdj_d)}">${formatNum(row.kdj_d, 2)}</td>
                            <td class="${getCompareColorClass(row.kdj_j, prevR.kdj_j)}">${formatNum(row.kdj_j, 2)}</td>
                            <td class="${getCompareColorClass(row.obv_millions, prevR.obv_millions)}">${formatNum(row.obv_millions, 3)}</td>
                        </tr>
                    `;
                });

                // 補回缺失的 1D Flow 每日列表
                if(mfRes && mfRes.data) {
                    mfRes.data.forEach((row, i) => {
                        moneyFlowDailyRows += `
                            <div class="grid grid-cols-2 text-sm gap-y-1">
                                <span class="text-gray-600">Day -${i} (${row.Record_Date.slice(5)})</span>
                                <span class="text-right font-medium ${getFlowColor(row.money_flow_million)}">${formatNum(row.money_flow_million, 2)}</span>
                            </div>
                        `;
                    });
                }

                const bodyHtml = `
                    <div class="p-6 bg-white">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-6">
                            <div>
                                <h3 class="font-bold text-blue-900 border-b pb-1 mb-2 text-sm">--- SECTION 1: BASIC FUNDAMENTALS ---</h3>
                                <div class="grid grid-cols-2 text-sm gap-y-2 items-center">
                                    <span class="text-gray-600">Market Cap (M)</span><span class="text-right font-medium">${formatNum(latest.market_cap_million, 2)}</span>
                                    <span class="text-gray-600">P/E Ratio</span><span class="text-right font-medium">${formatNum(latest.pe_ratio, 2)}</span>
                                    <span class="text-gray-600">P/B Ratio</span><span class="text-right font-medium">${formatNum(latest.pb_ratio, 2)}</span>
                                    <span class="text-gray-600">Free Cash Flow (M)</span><span class="text-right font-medium">${formatNum(latest.free_cash_flow_million, 2)}</span>
                                    <span class="text-gray-600 pt-2 border-t mt-1">PEG Ratio</span><span class="text-right font-medium pt-2 border-t mt-1">${formatNum(latest.peg_ratio, 2)}</span>
                                    <span class="text-gray-600">Dividend Yield (%)</span><span class="text-right font-medium">${formatNum(latest.dividend_yield, 2)}</span>
                                    <span class="text-gray-600">ROE</span><span class="text-right font-medium">${formatNum(latest.roe, 3)}</span>
                                    <span class="text-gray-600">Beta</span><span class="text-right font-medium">${formatNum(latest.beta, 3)}</span>
                                    <span class="text-gray-600">Debt/Equity (%)</span><span class="text-right font-medium">${formatNum(latest.debt_to_equity, 3)}</span>
                                    <span class="text-gray-600">52 Wk High / Low</span><span class="text-right font-medium">${formatNum(latest.week_52_high, 2)} / ${formatNum(latest.week_52_low, 2)}</span>
                                    <span class="text-gray-600">Avg Vol 10D / 3M</span><span class="text-right font-medium">${formatNum(latest.avg_vol_10d_million, 3)} / ${formatNum(latest.avg_vol_3m_million, 3)}</span>
                                    <span class="text-gray-600">Target Mean Px</span><span class="text-right font-medium">${formatNum(latest.target_mean_price, 2)}</span>
                                </div>
                            </div>
                            <div>
                                <h3 class="font-bold text-blue-900 border-b pb-1 mb-2 text-sm">--- SECTION 2: SMART MONEY ---</h3>
                                <div class="grid grid-cols-2 text-sm gap-y-2 items-center">
                                    <span class="text-gray-600">SMA Trend</span><span class="text-right font-bold ${sd.sma_trend==='Bullish'?'text-green-600':(sd.sma_trend==='Bearish'?'text-red-600':'text-gray-700')}">${sd.sma_trend||'N/A'}</span>
                                    <span class="text-gray-600">MACD Mom.</span><span class="text-right font-bold ${sd.macd_momentum==='Positive'?'text-green-600':(sd.macd_momentum==='Negative'?'text-red-600':'text-gray-700')}">${sd.macd_momentum||'N/A'}</span>
                                    <span class="text-gray-600">RS vs Market</span>${getCompareHtml(latest.rs_vs_market, prevData.rs_vs_market, 2, 'abs')}
                                    <span class="text-gray-600">ATR</span>${getCompareHtml(latest.atr, prevData.atr, 3, 'pct')}
                                    <span class="text-gray-600">RVOL</span>${getCompareHtml(latest.rvol, prevData.rvol, 2, 'pct')}
                                    <span class="text-gray-600">BB Width Rank</span>${getCompareHtml(latest.bb_width_rank, prevData.bb_width_rank, 2, 'abs')}
                                    <span class="text-gray-600 pt-2 border-t mt-1">Pre-Uptrend</span>${getTextCompareHtml(latest.pre_uptrend_signal, prevData.pre_uptrend_signal, 'N/A', 'font-bold text-red-600', 'pt-2 border-t mt-1')}
                                    <span class="text-gray-600">Vol Squeeze</span><span class="text-right font-bold ${sd.vol_squeeze==='Squeeze (Ready)'?'text-amber-600':'text-gray-700'}">${sd.vol_squeeze||'Normal'}</span>
                                    <span class="text-gray-600">Pullback Signal</span><span class="text-right font-bold ${sd.pullback_signal==='BUY DIP'?'text-green-600':'text-gray-500'}">${sd.pullback_signal||'N/A'}</span>
                                    <span class="text-gray-600">Global Sector %</span><span class="text-right font-medium">${formatNum(latest.global_sector_trend_pct, 2)}</span>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-3 rounded border">
                                <h3 class="font-bold text-blue-900 border-b pb-1 mb-2 text-sm">--- SECTION 4: MONEY FLOW ---</h3>
                                <div class="grid grid-cols-2 text-sm gap-y-1 mb-2">
                                    <span class="text-gray-800 font-bold">Last 5 Days</span><span class="text-right font-bold ${getFlowColor(latest.money_flow_5d_million)}">${formatNum(latest.money_flow_5d_million, 2)}</span>
                                    <span class="text-gray-800 font-bold border-b pb-1">Last 10 Days</span><span class="text-right font-bold border-b pb-1 ${getFlowColor(latest.money_flow_10d_million)}">${formatNum(latest.money_flow_10d_million, 2)}</span>
                                </div>
                                <div class="mt-2 font-bold text-gray-700 mb-1 text-xs">Daily 1D Flow:</div>
                                <div class="max-h-64 overflow-y-auto pr-2">
                                    ${moneyFlowDailyRows}
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-2 flex justify-between items-end">
                            <h3 class="font-bold text-blue-900 text-sm">--- SECTION 3: HISTORICAL TECHNICALS ---</h3>
                            <div class="flex items-center gap-4">
                                <span class="text-xs text-gray-500 font-medium">提示: 藍色代表比昨日高，橙色代表比昨日低</span>
                                <button onclick="copyToClipboard('${ticker}')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 text-xs font-bold py-2 px-4 rounded shadow border border-blue-300">📋 複製 TSV</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto mb-6">
                            <table class="history-table">
                                <thead><tr><th>Date</th><th>Close</th><th>Open</th><th>High</th><th>Low</th><th>Chg(%)</th><th>Vol(M)</th><th>RVOL</th><th>SMA5</th><th>SMA10</th><th>SMA20</th><th>SMA50</th><th>SMA200</th><th>MACD</th><th>RSI</th><th>ADX</th><th>KDJ_K</th><th>KDJ_D</th><th>KDJ_J</th><th>OBV(M)</th></tr></thead>
                                <tbody>${historyRows}</tbody>
                            </table>
                        </div>
                    </div>
                `;

                let tsv = `=== TICKER: ${ticker} ===\nDate:\t${latest.trading_date}\nPrice:\t${formatNum(latest.current_price, 3)}\nChange:\t${changeSign}${formatNum(changePct, 2)}%\nBaZi:\t${bazi.label}\n\n`;
                tsv += `Date\tClose\tChg(%)\tVol(M)\tRVOL\tSMA5\tSMA20\tMACD\tRSI\tKDJ_J\tOBV(M)\n`;
                records.forEach(r => tsv += `${r.trading_date}\t${formatNum(r.close_price||r.current_price,3)}\t${formatNum(r.change_pct,2)}%\t${formatNum(r.vol_million,3)}\t${formatNum(r.rvol,2)}\t${formatNum(r.sma5,3)}\t${formatNum(r.sma20,3)}\t${formatNum(r.macd,3)}\t${formatNum(r.rsi,2)}\t${formatNum(r.kdj_j,2)}\t${formatNum(r.obv_millions,3)}\n`);
                window.clipboardDataMap[ticker] = tsv;

                content.innerHTML = `<div class="analysis-card text-left">${headerHtml}${bodyHtml}</div>`;
                windowCache[ticker] = true;

            } catch (err) {
                content.innerHTML = `<div class="p-8 text-red-500 font-bold">資料載入失敗，請檢查連線。</div>`;
            }
        };

        // ==========================================
        // 初始化啟動
        // ==========================================
        document.getElementById('btn-load-date').addEventListener('click', fetchMacroData);
        document.getElementById('search-ticker').addEventListener('input', executeScreenerLogic);
        document.addEventListener('DOMContentLoaded', async () => { await fetchInitialData(); await fetchMacroData(); });
    </script>
</body>
</html>
