    <style>
        .stock-checkbox { appearance: none; background-color: #fff; margin: 0; font: inherit; color: currentColor; width: 1.25em; height: 1.25em; border: 1px solid #d1d5db; border-radius: 0.25em; display: grid; place-content: center; cursor: pointer; transition: all 0.2s; }
        .stock-checkbox::before { content: ""; width: 0.7em; height: 0.7em; transform: scale(0); transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em #fff; transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .stock-checkbox:checked { border-color: #2563eb; background-color: #2563eb; }
        .stock-checkbox:checked::before { transform: scale(1); }
        .action-btn { cursor: pointer; user-select: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .action-btn:active { transform: scale(1.3); }
        .btn-inactive { opacity: 0.25; filter: grayscale(100%); }
        .btn-inactive:hover { opacity: 0.7; filter: grayscale(0%); transform: scale(1.1); }
        .btn-active { opacity: 1; filter: grayscale(0%); transform: scale(1.15); drop-shadow: 0 4px 3px rgb(0 0 0 / 0.07); }
        
        /* 手風琴展開動畫 */
        .expansion-row { display: none; background-color: #fafafa; box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.03); }
        .expansion-row.open { display: table-row; }
        .history-table th, .history-table td { border: 1px solid #e5e7eb; padding: 0.4rem; text-align: right; white-space: nowrap; font-size: 0.8rem;}
        .history-table th { background-color: #f3f4f6; text-align: center; font-weight: 600;}
    </style>
</head>

    <div class="max-w-[1400px] mx-auto space-y-6">

                <a href="#" class="px-4 py-2 bg-blue-50 text-blue-700 rounded-lg text-sm font-bold border border-blue-200 shadow-sm cursor-default">👑 選股與深度分析</a>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <input type="text" id="search-ticker" placeholder="🔍 搜尋代號或公司" class="w-full sm:w-64 bg-white border border-gray-300 rounded-lg text-sm px-4 py-2 outline-none focus:border-blue-500 shadow-sm">
            </div>

        <!-- 儀表板控制區 -->
        <header class="bg-white border border-gray-200 p-6 rounded-xl shadow-md space-y-4">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 border-b border-gray-100 pb-4">
                <div class="space-y-3">
                    <h1 class="text-3xl font-bold text-blue-900">🎣 智能選股與十二長生儀表板</h1>
                    <!-- 策略切換按鈕 -->
                    <div class="flex flex-wrap gap-2 bg-gray-100 p-1.5 rounded-lg border border-gray-200 inline-flex shadow-inner">

                        </label>
                        <label class="cursor-pointer relative">
                            <input type="radio" name="strategy" value="long_term" onchange="switchStrategy('long_term')" class="peer sr-only">

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex flex-wrap items-end gap-4 shadow-sm">
                    <div>

        <!-- 數據表格區 -->
        <section class="bg-white border border-gray-200 rounded-xl shadow-md overflow-hidden">
            <div class="flex border-b border-gray-200 bg-gray-50 pt-2 px-2 gap-1">
                <button id="tab-hk" class="market-tab px-6 py-3 text-sm font-bold transition-all bg-white text-blue-700 border-t-2 border-blue-600 border-x border-gray-200 rounded-t-lg z-10 -mb-px" onclick="switchTab('HK')">🇭🇰 港股市場 (HKEX)</button>
                <button id="tab-us" class="market-tab px-6 py-3 text-sm font-bold transition-all bg-gray-100 text-gray-500 hover:bg-gray-50 border-b border-gray-200 rounded-t-lg" onclick="switchTab('US')">🇺🇸 美股市場 (S&P 500)</button>
            </div>

            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-white">

                        <input type="checkbox" id="check-all" class="stock-checkbox">
                        <span class="text-sm text-gray-700 font-bold">全選篩選結果</span>
                    </label>
                    <span id="match-count" class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full border border-blue-200">載入中...</span>
                </div>
                <button id="btn-copy-selected" class="bg-gray-800 hover:bg-gray-700 text-white text-sm font-bold px-5 py-2 rounded-lg flex gap-2">
                    📋 複製選取代號 (<span id="selected-count">0</span>)
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm text-gray-700 border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-600 font-semibold bg-gray-50">
                            <th class="py-4 px-2 w-20 text-center text-xs tracking-tighter">持倉/監察</th>
                            <th class="py-4 px-2 text-center text-xs">選取</th>
                            <th class="py-4 px-4">市場/代號</th>
                            <th class="py-4 px-4 text-center">十二長生狀態</th>
                            <th class="py-4 px-4 text-center">歷史資金 (10➔5➔1)</th>
                            <th class="py-4 px-4 text-center leading-tight">超賣指標<br><span class="text-xs text-gray-400 font-normal">MFI/RSI/KDJ</span></th>
                            <th class="py-4 px-4 text-center leading-tight">基本面<br><span class="text-xs text-gray-400 font-normal">P/E & 息率</span></th>
                            <th class="py-4 px-4 text-center leading-tight">護城河<br><span class="text-xs text-gray-400 font-normal">Val & ROE</span></th>
                            <th class="py-4 px-4 text-right" id="score-header">綜合分數</th>
                            <th class="py-4 px-4 text-center">動作</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-gray-100">
                        <tr><td colspan="10" class="p-8 text-center text-gray-500">正在下載最新雲端數據...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // ==========================================
        // 2. 狀態與輔助函數
        // ==========================================
        let latestMarketData = [], userLists = {}, windowCache = {}; 
        let activeMarket = 'HK', activeStrategy = 'ultimate_resonance'; 
        
        const formatMoney = (v) => v ? (Math.abs(v) >= 1000000 ? (v/1000000).toFixed(1)+'M' : v.toFixed(1)) : '-';
        const formatPct = (v) => v ? (v*100).toFixed(1)+'%' : '-';
        const formatNum = (v, d=2) => v ? Number(v).toFixed(d) : 'N/A';

        // 十二長生動態演算 (修正無效欄位後)
        function getBaZiState(s) {
            const p = s.price, sma20 = s.sma20, sma200 = s.sma200;
            const rvol = s.rvol, rsi = s.rsi, kdj_j = s.kdj_j;
            const f5 = s.flow_5d, f10 = s.flow_10d, macd = s.macd;
            const obvDiv = s.obvDiv, preUp = s.preUp;

            if (rsi > 75 && kdj_j > 100) return { label: '🔥 帝旺', c: 'bg-orange-100 text-orange-800 border-orange-300 font-bold' };
            // 長生: 突破 SMA20 且 RVOL 爆量 且 MACD為正
            if (p > sma20 && rvol >= 1.5 && macd > 0) return { label: '🚀 長生 (爆量)', c: 'bg-red-100 text-red-700 border-red-300 font-black shadow-sm' };
            if (p > sma20) return { label: '🌳 生長', c: 'bg-green-100 text-green-800 border-green-200 font-medium' };
            if (p < sma200 && rsi < 30 && kdj_j < 0) return { label: '⚡ 絕', c: 'bg-slate-800 text-white border-slate-900 font-bold' };
            // 養: 資金連續流入
            if (p <= sma20 && f5 > 0 && f10 > 0) return { label: '🍼 養', c: 'bg-lime-100 text-lime-800 border-lime-300 font-bold' };
            // 胎: 有背離或準備訊號，資金開始微流入
            if (p < sma20 && (f5 > 0 || f10 > 0) && (obvDiv || preUp.includes('Squeeze') || preUp.includes('Accumulation'))) return { label: '🌱 胎', c: 'bg-pink-100 text-pink-800 border-pink-200 font-medium' };
            
            return { label: '🍂 衰/死', c: 'bg-gray-100 text-gray-500 border-gray-200' };
        }

        // ==========================================
        // 3. UI 互動與主資料抓取
        // ==========================================
        window.switchTab = (m) => { activeMarket = m; executeScreenerLogic(); };
        window.switchStrategy = (s) => { activeStrategy = s; executeScreenerLogic(); };
        
        window.toggleList = async (ticker, category) => {
            const current = userLists[ticker];
            if (current === category) {
                delete userLists[ticker];
                executeScreenerLogic();
                await supabaseClient.from('my_portfolio').delete().eq('ticker', ticker);
            } else {
                userLists[ticker] = category;
                executeScreenerLogic();
                await supabaseClient.from('my_portfolio').upsert({ ticker, category }, { onConflict: 'ticker' });
            }
        };

        async function fetchInitialData() {
            const [{ data: hD }, { data: uD }, { data: pD }] = await Promise.all([
                supabaseClient.from('money_flow_hk').select('Record_Date').order('Record_Date', { ascending: false }).limit(1),
                supabaseClient.from('money_flow_sp500').select('Record_Date').order('Record_Date', { ascending: false }).limit(1),
                supabaseClient.from('my_portfolio').select('ticker, category')
            ]);
            if(hD?.length) document.getElementById('hk-date').value = hD[0].Record_Date.slice(0,10);
            if(uD?.length) document.getElementById('us-date').value = uD[0].Record_Date.slice(0,10);
            userLists = {}; if(pD) pD.forEach(r => userLists[r.ticker] = r.category || 'watchlist');
        }

        async function fetchMacroData() {
            document.getElementById('stock-table-body').innerHTML = `<tr><td colspan="10" class="p-8 text-center text-blue-600 font-bold animate-pulse">🔄 正在抓取全市場巨觀數據...</td></tr>`;
            try {
                // 👉 修正重點：移除了不存在的 macd_momentum 與 vol_squeeze，換成正確的 pre_uptrend_signal
                const multiCols = 'ticker, company_name, sector, current_price, sma20, sma200, macd, rsi, kdj_j, obv_divergence, pre_uptrend_signal, rvol, pe_ratio, dividend_yield, value_rating, roe, money_flow_million, money_flow_5d_million, money_flow_10d_million';
                
                const [mHK, mUS] = await Promise.all([
                    supabaseClient.from('multi_stock_analysis_hk').select(multiCols).eq('trading_date', document.getElementById('hk-date').value).limit(3000),
                    supabaseClient.from('multi_stock_analysis_sp500').select(multiCols).eq('trading_date', document.getElementById('us-date').value).limit(3000)
                ]);

                latestMarketData = [
                    ...(mHK.data||[]).map(r => ({...r, market: 'HK'})), 
                    ...(mUS.data||[]).map(r => ({...r, market: 'US'}))
                ];
                executeScreenerLogic();
            } catch (err) { 
                console.error(err); 
                document.getElementById('stock-table-body').innerHTML = `<tr><td colspan="10" class="p-8 text-center text-red-500 font-bold">❌ 抓取失敗，請檢查網路。</td></tr>`;
            }
        }

        // ==========================================
        // 4. 篩選與渲染 (Screener Logic)
        // ==========================================
        function processStock(r) {
            return {
                ticker: r.ticker, market: r.market, name: r.company_name, sector: r.sector,
                price: r.current_price, sma20: r.sma20, sma200: r.sma200, macd: r.macd,
                rsi: r.rsi, kdj_j: r.kdj_j, rvol: r.rvol, obvDiv: r.obv_divergence === 'Yes', preUp: r.pre_uptrend_signal || '',
                flow_1d: r.money_flow_million||0, flow_5d: r.money_flow_5d_million||0, flow_10d: r.money_flow_10d_million||0,
                pe: r.pe_ratio||0, divYield: r.dividend_yield||0, valRating: r.value_rating||0, roe: r.roe||0, score: 0
            };
        }

        function executeScreenerLogic() {
            let all = latestMarketData.filter(r => r.market === activeMarket).map(processStock);
            
            all.forEach(s => s.bazi = getBaZiState(s));

            let holding = all.filter(s => userLists[s.ticker] === 'holding');
            let watchlist = all.filter(s => userLists[s.ticker] === 'watchlist');
            
            let filtered = all.filter(s => {
                if (userLists[s.ticker]) return false; 
                if (activeStrategy === 'short_term') return s.flow_5d > 0 && s.rsi < 40 && s.valRating >= 3;
                if (activeStrategy === 'long_term') return s.valRating >= 3 && s.rsi < 35 && s.price < s.sma200;
                if (activeStrategy === 'ultimate_resonance') {
                    return ['🌱 胎', '🍼 養', '🚀 長生 (爆量)'].includes(s.bazi.label) && s.valRating >= 3;
                }
            });

            const sorter = (a, b) => b.flow_5d - a.flow_5d;
            holding.sort(sorter); watchlist.sort(sorter); filtered.sort(sorter);

            renderTable(holding, watchlist, filtered);
        }

        function renderTable(holding, watchlist, filtered) {
            const tbody = document.getElementById('stock-table-body');
            document.getElementById('match-count').innerText = `篩選結果: ${filtered.length} 隻`;
            tbody.innerHTML = '';

            const createRow = (s, category) => {
                const tr = document.createElement('tr');
                let bg = 'hover:bg-blue-50 border-b border-gray-100';
                if(category==='holding') bg = 'bg-yellow-50/60 hover:bg-yellow-100 border-b border-yellow-200';
                if(category==='watchlist') bg = 'bg-teal-50/40 hover:bg-teal-100 border-b border-teal-100';
                tr.className = bg;

                const holdCls = category === 'holding' ? 'btn-active text-yellow-600' : 'btn-inactive text-gray-500';
                const watchCls = category === 'watchlist' ? 'btn-active text-teal-600' : 'btn-inactive text-gray-500';

                const maxF = Math.max(Math.abs(s.flow_10d), 1);
                const drawBar = (val, x) => {
                    const h = Math.abs((val/maxF)*12);
                    return `<rect x="${x}" y="${val>0 ? 15-h : 15}" width="8" height="${h||2}" rx="1" fill="${val>0?'#10B981':'#EF4444'}" />`;
                };

                tr.innerHTML = `
                    <td class="py-3 px-2 text-center border-r border-gray-100">
                        <div class="flex justify-center gap-2 text-xl">
                            <span class="action-btn ${holdCls}" onclick="toggleList('${s.ticker}', 'holding')">💼</span>
                            <span class="action-btn ${watchCls}" onclick="toggleList('${s.ticker}', 'watchlist')">👀</span>
                        </div>
                    </td>
                    <td class="py-3 px-2 text-center"><input type="checkbox" class="stock-checkbox"></td>
                    <td class="py-3 px-4">
                        <div class="font-bold text-blue-900 font-mono tracking-tight text-base">${s.ticker}</div>
                        <div class="text-xs text-gray-500 truncate w-32">${s.name}</div>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <span class="px-2.5 py-1 text-xs border rounded-md shadow-sm ${s.bazi.c}">${s.bazi.label}</span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <svg class="w-12 h-8" viewBox="0 0 40 30" style="overflow:visible">
                                <line x1="0" y1="15" x2="40" y2="15" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="2,2" />
                                ${drawBar(s.flow_10d-s.flow_5d, 2)} ${drawBar(s.flow_5d-s.flow_1d, 16)} ${drawBar(s.flow_1d, 30)}
                            </svg>
                        </div>
                    </td>
                    <td class="py-3 px-4 text-center font-mono text-xs">
                        <span class="${s.rsi < 40 ? 'text-teal-600 font-bold' : 'text-gray-500'}">RSI:${s.rsi.toFixed(1)}</span><br>
                        <span class="${s.kdj_j < 20 ? 'text-teal-600 font-bold' : 'text-gray-500'}">KDJ:${s.kdj_j.toFixed(1)}</span>
                    </td>
                    <td class="py-3 px-4 text-center font-mono text-xs">
                        <span class="text-gray-500">P/E:</span> <span class="font-bold">${s.pe>0?s.pe.toFixed(1):'N/A'}</span><br>
                        <span class="text-gray-500">Div:</span> <span class="text-purple-700 font-bold">${s.divYield>0?s.divYield.toFixed(2)+'%':'0%'}</span>
                    </td>
                    <td class="py-3 px-4 text-center font-mono text-xs">
                        <span class="text-gray-500">Val:</span> <span class="text-orange-600 font-bold">${s.valRating>0?s.valRating+'/5':'-'}</span><br>
                        <span class="text-gray-500">ROE:</span> <span class="font-bold">${s.roe?formatPct(s.roe):'N/A'}</span>
                    </td>
                    <td class="py-3 px-4 text-right font-mono font-bold text-gray-800">${formatMoney(s.flow_5d)}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="toggleAnalysis('${s.ticker}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-1.5 px-3 rounded border border-indigo-200 transition">📊 分析</button>
                    </td>
                `;
                tbody.appendChild(tr);

                const expandTr = document.createElement('tr');
                expandTr.id = `expand-${s.ticker}`;
                expandTr.className = 'expansion-row';
                expandTr.innerHTML = `<td colspan="10" class="p-4"><div id="content-${s.ticker}" class="text-center text-sm text-gray-500">載入歷史數據中...</div></td>`;
                tbody.appendChild(expandTr);
            };

            if(holding.length) { holding.forEach(s => createRow(s, 'holding')); }
            if(watchlist.length) {
                const sep = document.createElement('tr'); sep.innerHTML=`<td colspan="10" class="text-center font-bold bg-teal-100/60 py-2 text-teal-800 text-xs">👀 監察名單</td>`; tbody.appendChild(sep);
                watchlist.forEach(s => createRow(s, 'watchlist'));
            }
            if(filtered.length) {
                const sep = document.createElement('tr'); sep.innerHTML=`<td colspan="10" class="text-center font-bold bg-gray-200/80 py-2 text-gray-600 text-xs">👇 最新篩選結果</td>`; tbody.appendChild(sep);
                filtered.forEach(s => createRow(s, 'filtered'));
            }
        }

        // ==========================================
        // 5. 延遲載入 (Lazy Load) 歷史分析數據
        // ==========================================
        window.toggleAnalysis = async (ticker) => {
            const row = document.getElementById(`expand-${ticker}`);
            const content = document.getElementById(`content-${ticker}`);
            
            if (row.classList.contains('open')) {
                row.classList.remove('open'); return;
            }
            document.querySelectorAll('.expansion-row.open').forEach(el => el.classList.remove('open'));
            row.classList.add('open');

            if (windowCache[ticker]) return;

            content.innerHTML = `<div class="animate-pulse text-indigo-600 font-bold py-4">⏳ 正在為 ${ticker} 抓取 20 天歷史軌跡...</div>`;

            try {
                const mfTable = activeMarket === 'HK' ? 'money_flow_hk' : 'money_flow_sp500';
                const [mfRes, sdRes] = await Promise.all([
                    supabaseClient.from(mfTable).select('*').eq('ticker', ticker).order('Record_Date', { ascending: false }).limit(20),
                    supabaseClient.from('stock_data').select('*').eq('ticker', ticker).order('date', { ascending: false }).limit(20)
                ]);

                if (!sdRes.data || sdRes.data.length === 0) {
                    content.innerHTML = `<div class="text-red-500 py-4">無法取得歷史數據。</div>`; return;
                }

                let historyRows = '';
                sdRes.data.forEach(row => {
                    historyRows += `
                        <tr class="hover:bg-indigo-50">
                            <td>${row.date}</td>
                            <td class="font-bold">${formatNum(row.close_price, 3)}</td>
                            <td>${formatNum(row.change_pct, 2)}%</td>
                            <td class="${row.close_price > row.sma5 ? 'text-green-600 font-bold' : ''}">${formatNum(row.sma5, 2)}</td>
                            <td class="${row.close_price > row.sma20 ? 'text-green-600 font-bold' : ''}">${formatNum(row.sma20, 2)}</td>
                            <td>${formatNum(row.rvol, 2)}</td>
                            <td>${formatNum(row.macd, 3)}</td>
                            <td>${formatNum(row.obv_millions, 2)}</td>
                        </tr>
                    `;
                });

                let flowRows = '';
                if(mfRes.data) {
                    mfRes.data.forEach(row => {
                        flowRows += `<div class="flex justify-between border-b border-gray-100 py-1"><span class="text-gray-500">${row.Record_Date.slice(5)}</span><span class="${row.money_flow_million>0?'text-green-600':'text-red-600'} font-bold">${formatMoney(row.money_flow_million)}</span></div>`;
                    });
                }

                const html = `
                    <div class="bg-white p-4 rounded border border-indigo-100 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-6 text-left">
                        <div class="md:col-span-3">
                            <h4 class="font-bold text-indigo-900 mb-2 border-b border-indigo-100 pb-1">📈 過去 20 天價格與技術軌跡</h4>
                            <div class="overflow-x-auto">
                                <table class="history-table w-full">
                                    <thead><tr><th>Date</th><th>Close</th><th>Chg%</th><th>SMA5</th><th>SMA20</th><th>RVOL</th><th>MACD</th><th>OBV(M)</th></tr></thead>
                                    <tbody>${historyRows}</tbody>
                                </table>
                            </div>
                        </div>
                        <div>
                            <h4 class="font-bold text-indigo-900 mb-2 border-b border-indigo-100 pb-1">💰 每日資金淨流入</h4>
                            <div class="text-xs font-mono max-h-64 overflow-y-auto pr-2">${flowRows}</div>
                        </div>
                    </div>
                `;
                content.innerHTML = html;
                windowCache[ticker] = true;

            } catch (err) {
                content.innerHTML = `<div class="text-red-500 py-4">數據載入失敗，請重試。</div>`;
            }
        };

        // ==========================================
        // 初始化啟動
        // ==========================================
        document.getElementById('btn-load-date').addEventListener('click', fetchMacroData);
        document.getElementById('search-ticker').addEventListener('input', executeScreenerLogic);
        
        document.addEventListener('DOMContentLoaded', async () => {
            await fetchInitialData();
            await fetchMacroData();
        });
    </script>
</body>
</html>
